function manyItems(n){
  var out=[];
  for(var i=0;i<n;i++) out.push({
    variant:"abcde"[i%5], label:"Option "+(i+1), turn:["t1","t3","t5","t7"][i%4],
    prompt:SESSION_PROMPTS[i%SESSION_PROMPTS.length],
    native:SESSION_SIZES[i%SESSION_SIZES.length]
  });
  return out;
}
step({id:"F4",sec:"F",name:"Four concepts asked for",note:"Asking for four gives four. The picker grid holds them at a smaller card size rather than forcing a scroll.",
  apply:function(){ reset(); S.chat.visible=true; S.composer.visible=true; S.composer.locked=true;
    S.composer.placeholder="Pick a concept below to continue…";
    S.chat.messages=[ uMsg("Generate 4 versions of a Diwali sale creative for Pantaloons — flat 30% off, festive theme, warm palette.","t1"),
      artMsg(ART_DIWALI_SET,"v1","t1"),
      aMsg("Made all 4 you asked for — pick one to keep editing, or ask me to regenerate any of them.","t1") ];
    S.picker.visible=true; S.picker.cardW=190;
    S.picker.cards=manyItems(4).map(function(x){return {variant:x.variant,label:x.label};}); },
  targets:[{label:"Pick one",to:"F5"}]});
step({id:"F5",sec:"F",name:"Four in the strip",note:"Four thumbnails, zero chevrons. The row fills left to right against a real 956px budget — it is not capped at three.",
  apply:function(){ reset(); editorBase(); S.strip.items=manyItems(4); },
  targets:[{label:"Generate more",to:"F6"},{label:"Collapse the strip",to:"F8"},{label:"Run out of credits",to:"H3"}]});
/* Two campaigns in one session, so the thread is genuinely long and genuinely
   scrolls. This is the state that makes the strip worth having: by image five
   the turn that produced image two is far off screen, and scrolling back to
   find it by eye is the thing the thumbnail click replaces. */
var TWO_CAMPAIGN_ITEMS = [
  {variant:"a",label:"Option 1",turn:"t1"}, {variant:"b",label:"Option 2",turn:"t1"},
  {variant:"c",label:"Warmer lamps",turn:"t3"},
  {variant:"d",label:"Black Friday",turn:"t5"}, {variant:"e",label:"Darker cut",turn:"t7"}
];
function twoCampaignThread(){
  return [
    uMsg(BRIEF,"t1"),
    artMsg(ART_DIWALI,"v1","t1"),
    aMsg("Here are two directions — same brief, different mood. Pick the one that's closest, or tell me what to change once you're in the editor.","t1"),
    uMsg("Option 1 is closer. The model's dupatta is competing with the offer block though.","t2"),
    aMsg("Agreed — the embroidery and the type are both high contrast in the same corner. I can soften the dupatta, or move the offer block left. Which would you rather keep dominant?","t2"),
    uMsg("Keep the offer dominant. And the diya lamps feel cold — warm them up and push the gold.","t3"),
    artMsg(ART_DIWALI,"v2","t3"),
    aMsg("Warmer lamp glow, richer gold across the type, and the dupatta dropped back a stop so the offer block leads. Composition and copy unchanged.","t3"),
    uMsg("That's the one. Save it for the WhatsApp send.","t4"),
    aMsg("Saved. It's 1080 × 1080, which is already WhatsApp-ready — no resize needed for that placement.","t4"),
    uMsg("Now a different campaign — Black Friday. Deep black and gold, flat 50% off, same brand lockup.","t5"),
    artMsg(ART_BF,"v1","t5"),
    aMsg("Black Friday cut in near-black with gold type. I kept the Pantaloons lockup in the same position as the Diwali set, so the two campaigns sit together in a deck.","t5"),
    uMsg("Good, but 50% needs to hit harder. It's the whole offer.","t6"),
    aMsg("I can scale the numeral and drop the supporting copy underneath it. That trades the 'on 2000+ styles' line for size — worth it?","t6"),
    uMsg("Yes. And darker still — drop the lamps, they read festive rather than Black Friday.","t7"),
    artMsg(ART_BF,"v2","t7"),
    aMsg("Lamps removed, ground taken darker, and the numeral scaled up with the supporting line dropped. The offer is now the brightest thing in the frame.","t7")
  ];
}
step({id:"F6",sec:"F",name:"Five across two campaigns",note:"Two artifacts across two campaigns, four versions between them. Every generation posts an <b>artifact card</b> into the thread — title and version, the way the live product draws it — and an edit posts the <i>next version of the same artifact</i> rather than a second one, which is why the Diwali card reads v2 and the Black Friday card starts again at v1.<br><br><b>Click any thumbnail</b>: the canvas swaps and the chat scrolls back to the turn that made it. The rail marks the whole turn, because the request is the context that makes the card mean anything, and the card itself takes a ring. Clicking a card does the reverse — it selects that image on the canvas. The thread is long and genuinely scrolls; fourteen thumbnails fit before the row overflows.",
  apply:function(){ reset(); editorBase(); S.strip.items=TWO_CAMPAIGN_ITEMS;
    S.chat.messages=twoCampaignThread(); S.strip.activeIndex=4; S.canvas.variant="e"; },
  targets:[{label:"Click the first thumbnail — jumps to that turn",to:"F6"},
    {label:"Keep generating",to:"F7"}]});
step({id:"F7",sec:"F",name:"Twenty — real overflow",note:"Now it genuinely overflows. The row scrolls rather than paging — every image is in the same strip and the scrollbar says how much of it you are looking at. Selecting one that is off-screen scrolls it into view.",
  apply:function(){ reset(); editorBase(); S.strip.items=manyItems(20); S.strip.activeIndex=13;
    S.canvas.variant=manyItems(20)[13].variant; },
  targets:[{label:"Keep generating past 20",to:"F11"},{label:"Click a thumbnail",to:"F9"},
    {label:"Open the export menu",to:"H4"}]});
step({id:"F11",sec:"F",name:"Past 20 — View all",note:"A long session caps the browsable row at 20. The 20th slot becomes <b>View all</b> with the real total, pinned to the trailing edge so it is visible without paging to find it. Clicking it releases the rest into the same scroll.",
  apply:function(){ reset(); editorBase(); S.strip.items=manyItems(27); S.strip.activeIndex=0;
    S.chat.messages=twoCampaignThread(); },
  targets:[{label:"Click View all 27 images",to:"F13"},{label:"Open Resize",to:"F12"},
    {label:"Back to the editor",to:"A5"}]});
step({id:"F13",sec:"F",name:"Gallery — a 120-image session",note:"Heavy sessions really do reach ~120 images. A horizontal strip cannot serve that, so <b>View all</b> opens a plain scrollable grid instead of releasing 100 more thumbnails into the paging row. Each card carries the image, its filename, its real size and the prompt that produced it — the prompt is what people actually recognise an image by.",
  apply:function(){ reset(); editorBase(); S.strip.items=manyItems(120); S.strip.activeIndex=0;
    S.chat.messages=twoCampaignThread(); S.gallery.open=true; },
  targets:[{label:"Pick an image — see what happens",to:"F14"},{label:"Close the gallery",to:"F11"}]});
step({id:"F14",sec:"F",name:"Picked from the gallery",note:"Answering the obvious question: picking a card does <b>not</b> open a separate viewer. The gallery closes, the image becomes the one on the editor canvas, and the chat jumps to the turn that created it — marked with the indigo rail. One selection model shared with the thumbnail strip, not a second one.",
  apply:function(){ reset(); editorBase(); S.strip.items=manyItems(120); S.strip.activeIndex=6;
    S.canvas.variant=manyItems(120)[6].variant;
    S.chat.messages=twoCampaignThread();
    S.chat.markedTurn=manyItems(120)[6].turn; S.chat.scrollTo=S.chat.markedTurn; },
  targets:[{label:"Open the gallery again",to:"F13"},{label:"Back to the editor",to:"A5"}]});
step({id:"F12",sec:"F",name:"Past 20, with the drawer open",note:"The strip is a shared header spanning the canvas <i>and</i> the drawer, so opening Resize does not narrow it — the same 20 images and the same View all tile stay put. Worth showing because a strip that reflowed here would be a different control depending on what else is open.",
  apply:function(){ reset(); editorBase(); S.strip.items=manyItems(27); S.strip.activeIndex=0;
    S.chat.messages=twoCampaignThread();
    S.toolbar.activeTool="resize"; S.resize.open=true;
    S.resize.generateOffer={label:"Generate at this size"};
    S.crop.on=true; S.crop.rect=[0,0,1,1]; S.resize.lastAction="drag"; },
  targets:[{label:"Click View all 27 images",to:"F12"},{label:"Close the drawer",to:"F11"}]});
step({id:"F8",sec:"F",name:"Strip collapsed",note:"Hiding the images leaves a 40px bar naming the count, so they are visibly still there rather than gone — and the 40px it gives up genuinely goes back to the canvas. A hide control that changes nothing but the contents of a band it still occupies has not hidden anything. The state persists for the session.",
  apply:function(){ reset(); editorBase(); S.strip.items=manyItems(4);
    S.strip.collapsed=true; },
  targets:[{label:"Expand the strip",to:"F5"},{label:"Click Close — strip goes with the editor",to:"A8"},
    {label:"Back to the editor",to:"A5"}]});
step({id:"F9",sec:"F",name:"Thumbnail clicked",note:"Clicking a thumbnail swaps the canvas <b>and</b> takes the chat back to the turn that produced it — the artifact card for that version is the anchor, ringed inside the marked turn. Without the marker the chat would silently jump.",
  apply:function(){ reset(); editorBase(); S.strip.items=manyItems(5); S.strip.activeIndex=2;
    S.canvas.variant="c"; S.chat.markedTurn="t3";
    S.chat.messages=[ uMsg("Generate 4 versions of a Diwali sale creative for Pantaloons.","t1"),
      artMsg(ART_DIWALI_SET,"v1","t1"),
      aMsg("Four directions on the same brief. Pick one to keep working on.","t1"),
      uMsg("Make the third one cooler — deeper greens, less gold.","t3"),
      artMsg(ART_DIWALI_SET,"v2","t3"),
      aMsg("Cooler version with deeper greens. The gold is now an accent rather than the base.","t3"),
      uMsg("Now try a version with the family on the right.","t4"),
      artMsg(ART_DIWALI_SET,"v3","t4"),
      aMsg("Family moved to the right, copy reflowed to the left.","t4") ]; },
  targets:[{label:"Click another thumbnail",to:"F9"},{label:"Open full screen",to:"F10"}]});
step({id:"F10",sec:"F",name:"Full-screen preview",note:"Read-only — no editing tools, because this state is for judging the image. Light and frosted so it reads as sitting <i>on</i> the editor rather than replacing it.",
  apply:function(){ reset(); editorBase(); S.fullscreen.open=true; S.toolbar.fullscreenActive=true; },
  targets:[{label:"Close, or press Esc",to:"A5"}]});
</script>
<script>
"use strict";
/* ---------------- G · Export ---------------- */
step({id:"G2",sec:"G",name:"Format picked",note:"The choice is remembered for the session, so someone exporting a run of creatives picks the format once rather than every time.",
  apply:function(){ reset(); editorBase(); S.dropdown.open=true; S.dropdown.selected=1;
    SESSION.exportFormat=1; },
  targets:[{label:"Download",to:"G3"},{label:"Click outside",to:"A5"}]});
step({id:"G3",sec:"G",name:"Download confirmed",note:"One toast vocabulary shared by download and copy: past tense, one line, and it names the real native size rather than the on-screen size.",
  apply:function(){ reset(); editorBase(); S.toast.text="Downloading JPG — 1080 × 1080"; },
  targets:[{label:"Toast dismisses",to:"A5"}]});
step({id:"G4",sec:"G",name:"Copied",note:"Same shape, different verb. <b>Divergence:</b> the canvas had a fourth export board labelled full-screen, which duplicated F10 and pointed at itself — full screen has one owner now, and it is F10.",
  apply:function(){ reset(); editorBase(); S.toast.text="Copied image to clipboard"; },
  targets:[{label:"Toast dismisses",to:"A5"}]});

/* ---------------- H · Edge cases ---------------- */
step({id:"H1",sec:"H",name:"Generation fails mid-stream",note:"A failure, so it is red and it persists. The toolbar is gone — there is no image to zoom or reframe. Retry is the single next step.",
  apply:function(){ reset(); S.chat.visible=true; S.composer.visible=true; S.composer.locked=true;
    S.artifact.exists=true; S.canvas.mode="emptySolid"; S.canvas.emptyIcon="alert";
    S.toolbar.visible=false;
    S.chat.messages=[ uMsg(BRIEF,"t1"), act("Drafting promotion config",false,"t1"),
      {kind:"banner",tone:"danger",title:"I couldn't finish that render",
       body:"Something interrupted generation partway through. Retry, or tell me what to change.",
       cta:"Retry",turn:"t1"} ]; },
  targets:[{label:"Retry",to:"A3"}]});
step({id:"H2",sec:"H",name:"Policy refusal — unsafe request",note:"Amber, not red: a limit is not a fault. The distinction matters — mixing them teaches people that the product is broken when it is actually working as designed.",
  apply:function(){ reset(); S.chat.visible=true; S.composer.visible=true; S.composer.focused=true;
    S.canvas.mode="emptyDashed"; S.canvas.emptyIcon="banAlt"; S.toolbar.visible=false;
    S.chat.messages=[ uMsg("make a fake government ID card mockup for the campaign","t1"),
      aMsg("I can't create documents that could pass as official records. I can make a campaign creative that references the offer without imitating an ID. Tell me the message you need and I'll draft it.","t1") ]; },
  targets:[{label:"Rephrase",to:"E1"}]});
step({id:"H3",sec:"H",name:"Quota reached",note:"A hard block, and the only edge case where the composer genuinely has nothing to send to. It names the reset and the route to more capacity rather than stopping at 'no'.",
  apply:function(){ reset(); S.chat.visible=true; S.composer.visible=true; S.composer.locked=true;
    S.canvas.mode="emptyDashed"; S.canvas.emptyIcon="banAlt"; S.toolbar.visible=false;
    S.chat.messages=[ uMsg("generate 5 more variants","t1"),
      {kind:"banner",tone:"warning",title:"You've used this month's image credits",
       body:"Credits reset on 1 October. Ask your admin to raise the limit if you need more before then.",turn:"t1"} ]; },
  targets:[{label:"Credits added",to:"A5"}]});
step({id:"H4",sec:"H",name:"Export menu, second use",note:"The same dropdown component as A6 — built once, used twice. Building it separately per surface is how two menus drift apart.",
  apply:function(){ reset(); editorBase(); S.dropdown.open=true; S.strip.items=manyItems(5); },
  targets:[{label:"Download",to:"G3"}]});
step({id:"H5",sec:"H",name:"Size breaks both limits",note:"A value can break the pixel bounds and the ratio at once, so the validator composes both into one message rather than reporting whichever it checked first.",
  apply:function(){ reset(); drawerBase(); S.resize.lastAction="type"; S.resize.resetEnabled=true;
    S.resize.widthVal=60; S.resize.heightVal=900; S.canvas.dim=true; },
  targets:[{label:"Fix the size",to:"D6"}]});
step({id:"H6",sec:"H",name:"Refusal — copyrighted style",note:"The third refusal class. Amber again, and again it offers something the user can actually do next.",
  apply:function(){ reset(); S.chat.visible=true; S.composer.visible=true; S.composer.focused=true;
    S.canvas.mode="emptyDashed"; S.canvas.emptyIcon="banAlt"; S.toolbar.visible=false;
    S.chat.messages=[ uMsg("do it in the exact style of a Studio Ghibli poster","t1"),
      aMsg("I can't reproduce a studio's protected visual style. I can work in a hand-painted festive illustration style with soft light and warm colour, which gets close to the feel. Want me to draft one?","t1") ]; },
  targets:[{label:"Accept the alternative",to:"E1"}]});
step({id:"H7",sec:"H",name:"Nothing left to undo",note:"The history floor. Undo greys out rather than disappearing, and the toast says why — a control that vanishes reads as a bug.",
  apply:function(){ reset(); editorBase(); S.toolbar.canUndo=false; S.toolbar.canRedo=true;
    S.toast.text="Nothing left to undo — this is the original generation"; },
  targets:[{label:"Redo",to:"E1"}]});
step({id:"H8",sec:"H",name:"Connection lost mid-edit",note:"A failure, so red — and the last saved version is still on screen and named as safe. The toolbar goes, because nothing on the canvas can be acted on until the connection returns.",
  apply:function(){ reset(); editorBase(); S.canvas.dim=true; S.toolbar.visible=false;
    S.composer.locked=true; S.composer.placeholder="Reconnecting…";
    S.chat.messages=[ uMsg(BRIEF,"t1"), artMsg(ART_DIWALI,"v1","t1"),
      uMsg("make the background a cooler color","t2"),
      {kind:"banner",tone:"danger",title:"Lost connection while applying that edit",
       body:"Your last saved version is still here. Reconnect and try again.",cta:"Retry",turn:"t2"} ]; },
  targets:[{label:"Reconnect and retry",to:"E1"}]});
step({id:"H9",sec:"H",name:"Zoomed in past the pane",note:"The image is larger than its pane, so the pane clips and the toolbar pins to the bottom instead of hugging the image. The zoom readout is <b>derived</b> — the canvas had it typed, and the number was wrong.",
  apply:function(){ reset(); editorBase(); S.canvas.boxOverride=[1000,1000]; },
  targets:[{label:"Fit to screen",to:"A5"},{label:"Zoom far out instead",to:"H10"}]});
step({id:"H10",sec:"H",name:"Zoomed far out",note:"The other extreme. The artwork drops its copy below about 190px rather than scaling the type down into illegibility — a small creative is not a small photograph.",
  apply:function(){ reset(); editorBase(); S.canvas.boxOverride=[210,210]; },
  targets:[{label:"Fit to screen",to:"A5"}]});
</script>
<script>
"use strict";
/* ===========================================================================
   WIRING
   ======================================================================== */
var current = "F5", visited = [];
function stepById(id){ var r=STEPS.filter(function(s){return s.id===id;}); return r[0]||null; }

var rail=document.getElementById("rail"), insp=document.getElementById("insp"),
    curId=document.getElementById("curId"), curName=document.getElementById("curName");

function renderRail(){
  rail.innerHTML = SECTIONS.map(function(sec){
    var rows = STEPS.filter(function(s){return s.sec===sec.key;}).map(function(s){
      return '<button class="rrow'+(s.id===current?" on":"")+'" type="button" data-step="'+s.id+'">'+
        '<span class="ri">'+s.id+'</span><span class="rn">'+esc(s.name)+'</span></button>';
    }).join("");
    if(!rows) return "";
    return '<div class="rsec"><div class="rh"><span class="rt">'+esc(sec.title)+'</span>'+
      '<span class="rd">'+esc(sec.desc)+'</span></div>'+rows+'</div>';
  }).join("");
  Array.prototype.forEach.call(rail.querySelectorAll("[data-step]"), function(b){
    b.onclick=function(){ goStep(b.getAttribute("data-step")); };
  });
}

function renderInspector(){
  var s = stepById(current); if(!s) return;
  var seen = visited.concat([current]).filter(function(v,i,a){return a.indexOf(v)===i;});
  var divergence = /Divergence:/.test(s.note)
    ? '<div class="divg"><b>Diverges from the canvas.</b> See the note above — this is a deliberate correction, not a build slip.</div>' : "";
  insp.innerHTML =
    '<div class="iblk"><div class="ih">Where you have been</div><div class="chips">'+
      seen.map(function(id){ return '<span class="hchip'+(id===current?" now":"")+'">'+id+'</span>'; }).join("")+
    '</div></div>'+
    '<div class="iblk"><div class="ih">If you click…</div>'+
      (s.targets||[]).map(function(t){
        return '<button class="trow" type="button" data-goto="'+t.to+'"><span class="tl">'+esc(t.label)+
               '</span><span class="tt">'+t.to+'</span></button>'; }).join("")+
    '</div>'+
    '<div class="iblk"><div class="ih">This step</div><div class="note">'+s.note+'</div>'+divergence+'</div>'+
    '<div class="iblk"><div class="helpcard"><b>Use the screen.</b> Every control that leads somewhere is live. '+
      'Turn on <b>Click targets</b> to outline them, or use the list above to jump to an outcome.</div></div>';
  Array.prototype.forEach.call(insp.querySelectorAll("[data-goto]"), function(b){
    b.onclick=function(){ goStep(b.getAttribute("data-goto")); };
  });
}

function paintChrome(){
  var s=stepById(current); if(!s) return;
  curId.textContent=s.id; curName.textContent=s.name;
  document.getElementById("btnBack").disabled = visited.length===0;
}
var noteEl=null, noteT=null;
function outOfScope(id){
  if(!noteEl){ noteEl=document.createElement("div"); noteEl.className="wtnote";
    document.body.appendChild(noteEl); }
  noteEl.textContent = id+" is outside this file — it holds section F only, F5 to F10.";
  noteEl.classList.add("on");
  clearTimeout(noteT); noteT=setTimeout(function(){ noteEl.classList.remove("on"); }, 2200);
}
function goStep(id, quiet){
  var s=stepById(id); if(!s){ outOfScope(id); return; }
  if(current!==id && stepById(current)) visited.push(current);
  current=id;
  if(!quiet) s.apply();
  if(location.hash.replace("#","")!==id) location.hash=id;
  paintChrome(); renderRail(); render(); renderInspector();
}
document.getElementById("btnBack").onclick=function(){
  var p=visited.pop(); if(!p) return;
  current=p; stepById(p).apply(); location.hash=p;
  paintChrome(); renderRail(); render(); renderInspector();
};
document.getElementById("btnRestart").onclick=function(){
  visited=[]; SESSION.stripCollapsed=false; SESSION.exportFormat=0; goStep(HOME);
};
document.getElementById("btnTargets").onclick=function(e){
  document.body.classList.toggle("targets");
  e.currentTarget.classList.toggle("on", document.body.classList.contains("targets"));
};

/* ---- live interactions inside the app ---------------------------------- */
app.addEventListener("click", function(e){
  var t = e.target.closest("[data-act]"); if(!t) return;
  var a = t.getAttribute("data-act");
  if(a==="startImage"||a==="send"){ goStep(current==="A1"?"A2":"A3"); return; }
  if(a==="stop"){ goStep(current==="E2"?"E1":(current==="D9"?"D8":"A2")); return; }
  if(a==="resize"){ goStep("D2"); return; }
  if(a==="fullscreen"){ goStep("F10"); return; }
  if(a==="exitFullscreen"){ goStep("A5"); return; }
  if(a==="download"){ S.dropdown.open=!S.dropdown.open; render(); return; }
  if(a==="doDownload"){ goStep("G3"); return; }
  if(a==="copy"){ goStep("G4"); return; }
  if(a==="pickFormat"){ S.dropdown.selected=+t.getAttribute("data-i");
    SESSION.exportFormat=S.dropdown.selected; render(); return; }
  if(a==="closeArtifact"){ goStep("A8"); return; }
  if(a==="pickArtifact"){
    var tn=t.getAttribute("data-turn"), ix=-1;
    S.strip.items.forEach(function(it,i){ if(ix<0 && it.turn===tn) ix=i; });
    if(ix<0 || !S.strip.visible){ goStep("A5"); return; }
    S.strip.activeIndex=ix; S.canvas.variant=S.strip.items[ix].variant;
    S.chat.markedTurn=tn; S.chat.scrollTo=tn; render(); return; }
  if(a==="viewAll"){ S.gallery.open=true; render(); return; }
  if(a==="closeGallery"){ S.gallery.open=false; render(); return; }
  if(a==="galPick"){ var gi=+t.getAttribute("data-i"); S.strip.activeIndex=gi;
    S.canvas.variant=S.strip.items[gi].variant;
    S.chat.markedTurn=S.strip.items[gi].turn||null; S.chat.scrollTo=S.chat.markedTurn;
    S.gallery.open=false; render(); return; }
  if(a==="collapseStrip"){ SESSION.stripCollapsed=true; S.strip.collapsed=true; render(); return; }
  if(a==="expandStrip"){ SESSION.stripCollapsed=false; S.strip.collapsed=false; render(); return; }
  if(a==="pickThumb"){
    var i=+t.getAttribute("data-i"); S.strip.activeIndex=i;
    S.canvas.variant=S.strip.items[i].variant;
    S.chat.markedTurn=S.strip.items[i].turn||null;
    S.chat.scrollTo=S.chat.markedTurn;
    render(); return; }
  if(a==="pickCard"){ S.picker.mode="picked"; S.picker.pickedIndex=+t.getAttribute("data-i"); render(); return; }
  if(a==="useThis"){ goStep("A5"); return; }
  if(a==="regenAll"){ goStep("C3"); return; }
  if(a==="clearSearch"){ S.resize.searchQuery=""; S.resize.focusField="search"; S.resize.caret=0;
    S.resize.resetEnabled=false; render(); return; }
  if(a==="lockRatio"){ S.resize.linkRatio=!S.resize.linkRatio; render(); return; }
  if(a==="toggleGroup"){
    var g=t.getAttribute("data-g"), k=S.resize.openGroups.indexOf(g);
    if(k>=0) S.resize.openGroups.splice(k,1); else S.resize.openGroups.push(g);
    render(); return; }
  if(a==="pickTarget"){
    var id=t.getAttribute("data-id");
    if(id==="Freeform"){ S.resize.ratioActive="Freeform"; S.resize.selectedId=null;
      S.resize.lastAction="drag"; S.crop.on=true; }
    else {
      var tg=targetById(id); if(!tg) return;
      S.resize.selectedId=id; S.resize.lastAction="pick";
      CHANNEL_GROUPS.forEach(function(g){
        var its=g.items||g.subgroups.reduce(function(a,x){return a.concat(x.items);},[]);
        if(its.some(function(i){return i.id===id;}) && S.resize.openGroups.indexOf(g.name)<0)
          S.resize.openGroups.push(g.name);
      });
      S.resize.widthVal=tg.w; S.resize.heightVal=tg.h;
      S.resize.cropImpossible = tg.w>S.canvas.nativeW || tg.h>S.canvas.nativeH;
      S.resize.refusal = S.resize.cropImpossible ? {
        title:"I can't crop to "+tg.w+" × "+tg.h,
        body:"This image is "+S.canvas.nativeW+" × "+S.canvas.nativeH+", so there aren't enough pixels to crop that shape out of it. I can generate a new image at that size instead."
      } : null;
      S.resize.generateOffer = S.resize.cropImpossible
        ? {label:"Generate at "+tg.w+" × "+tg.h} : {label:"Generate at this size"};
      // seed the crop frame: largest that fits, centred
      if(!S.resize.cropImpossible){
        var f=fit(), ar=tg.w/tg.h, bw=f.w, bh=bw/ar;
        if(bh>f.h){ bh=f.h; bw=bh*ar; }
        S.crop.on=true;
        S.crop.rect=[ (f.w-bw)/2/f.w, (f.h-bh)/2/f.h, bw/f.w, bh/f.h ];
      } else S.crop.on=false;
    }
    S.resize.resetEnabled=true; render(); return; }
  if(a==="switchGenerate"||a==="generate"){ goStep("D9"); return; }
  if(a==="applyCrop"){ goStep("D11"); return; }
  if(a==="cancelDrawer"||a==="resetDrawer"){ goStep(a==="cancelDrawer"?"D1":"D2"); return; }
  if(a==="zoomFit"){ S.canvas.boxOverride=null; render(); return; }
  if(a==="zoomIn"||a==="zoomOut"){
    var f2=fit(), k2=(a==="zoomIn"?1.25:0.8);
    S.canvas.boxOverride=[Math.round(f2.w*k2),Math.round(f2.h*k2)]; render(); return; }
  if(a==="undo"||a==="redo"){ goStep("H7"); return; }
});

/* ---- drawer fields: real typing, real focus ---------------------------- */
app.addEventListener("input", function(e){
  var f = e.target.getAttribute && e.target.getAttribute("data-field"); if(!f) return;
  S.resize.focusField = f;
  S.resize.caret = e.target.selectionStart;
  if(f==="search"){
    S.resize.searchQuery = e.target.value;
    S.resize.resetEnabled = !!e.target.value;
  } else {
    var n = parseInt(e.target.value.replace(/[^0-9]/g,""),10);
    if(isNaN(n)) n = 0;
    var prevW=S.resize.widthVal||1, prevH=S.resize.heightVal||1;
    if(f==="w"){
      S.resize.widthVal = n;
      if(S.resize.linkRatio && n) S.resize.heightVal = Math.round(n * (prevH/prevW));
    } else {
      S.resize.heightVal = n;
      if(S.resize.linkRatio && n) S.resize.widthVal = Math.round(n * (prevW/prevH));
    }
    S.resize.lastAction = "type"; S.resize.selectedId = null; S.resize.resetEnabled = true;
    /* validate against BOTH the global rule and the selected channel's own */
  }
  render();
});
app.addEventListener("focusin", function(e){
  var f = e.target.getAttribute && e.target.getAttribute("data-field");
  if(f){ S.resize.focusField=f; S.resize.caret=e.target.selectionStart; }
});
app.addEventListener("focusout", function(e){
  if(e.target.getAttribute && e.target.getAttribute("data-field")) S.resize.focusField=null;
});

/* ---- crop dragging — genuinely live, not a picture of a drag ------------ */
(function(){
  var drag=null;
  app.addEventListener("mousedown", function(e){
    var h=e.target.closest(".crophandle"), box=e.target.closest("#cropbox");
    if(!h && !box) return;
    var img=document.getElementById("imgbox"); if(!img) return;
    e.preventDefault();
    /* Measure with getBoundingClientRect, which already accounts for the
       stage's transform:scale — dividing offsetWidth by a separate scale
       factor produced a 0/0 NaN and silently corrupted the rect. */
    var box2 = img.getBoundingClientRect();
    if(!box2.width || !box2.height) return;
    drag={ mode:h?("h:"+h.getAttribute("data-h")):"move", x:e.clientX, y:e.clientY,
           rect:S.crop.rect.slice(), w:box2.width, h:box2.height };
  });
  window.addEventListener("mousemove", function(e){
    if(!drag) return;
    var dx=(e.clientX-drag.x)/drag.w, dy=(e.clientY-drag.y)/drag.h;
    if(!isFinite(dx)||!isFinite(dy)) return;
    var r=drag.rect.slice();
    if(drag.mode==="move"){
      r[0]=Math.max(0,Math.min(1-r[2], r[0]+dx));
      r[1]=Math.max(0,Math.min(1-r[3], r[1]+dy));
    } else {
      var c=drag.mode.split(":")[1];
      if(c.indexOf("w")>=0){ var nx=Math.max(0,Math.min(r[0]+r[2]-0.05,r[0]+dx)); r[2]=r[2]+(r[0]-nx); r[0]=nx; }
      if(c.indexOf("e")>=0){ r[2]=Math.max(0.05,Math.min(1-r[0], r[2]+dx)); }
      if(c.indexOf("n")>=0){ var ny=Math.max(0,Math.min(r[1]+r[3]-0.05,r[1]+dy)); r[3]=r[3]+(r[1]-ny); r[1]=ny; }
      if(c.indexOf("s")>=0){ r[3]=Math.max(0.05,Math.min(1-r[1], r[3]+dy)); }
    }
    S.crop.rect=r;
    S.resize.lastAction="drag"; S.resize.selectedId=null; S.resize.resetEnabled=true;
    var f=fit();
    S.resize.widthVal=Math.round(r[2]*S.canvas.nativeW);
    S.resize.heightVal=Math.round(r[3]*S.canvas.nativeH);
    render();
  });
  window.addEventListener("mouseup", function(){ drag=null; });
})();

/* ===========================================================================
   F-ONLY BUILD. This file is the same walkthrough as the full one, scoped to
   section F — the image browser — at load time rather than by deleting steps.
   Nothing above this line differs, so the two files cannot drift apart in the
   steps they do share.

   The section runs F5 to F10 as the rail lists it, with F11 to F14 (View all,
   the gallery, picking from it) inside that run — ten steps. F4 is excluded:
   it is the variant picker, which belongs to the concept gate rather than to
   the image browser, and nothing else in the section leads back to it.
   ======================================================================== */
var SCOPE="F", DROP=["F4"], HOME="F5", EXIT_FS="F5";
STEPS = STEPS.filter(function(s){ return s.sec===SCOPE && DROP.indexOf(s.id)<0; });
var IN_SCOPE={}; STEPS.forEach(function(s){ IN_SCOPE[s.id]=1; });
/* Targets that pointed out of the section are removed rather than left to fail:
   the inspector's "If you click…" list is a promise about what happens next. */
STEPS.forEach(function(s){
  s.targets=(s.targets||[]).filter(function(t){ return IN_SCOPE[t.to]; });
});
SECTIONS = SECTIONS.filter(function(s){ return s.key===SCOPE; });

/* ---- deep links + keyboard --------------------------------------------- */
function stepFromHash(){
  var h=(location.hash||"").replace("#","").toUpperCase();
  return stepById(h)?h:HOME;
}
window.addEventListener("hashchange", function(){
  var id=stepFromHash(); if(id!==current) goStep(id);
});
document.addEventListener("keydown", function(e){
  if(e.key==="Escape" && S.fullscreen.open){ goStep(EXIT_FS); return; }
  if(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key!=="ArrowDown" && e.key!=="ArrowUp") return;
  var i=STEPS.findIndex(function(s){return s.id===current;});
  var n=e.key==="ArrowDown"?i+1:i-1;
  if(n>=0 && n<STEPS.length){ e.preventDefault(); goStep(STEPS[n].id); }
});

goStep(stepFromHash());
</script>
