<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aiRA Image Studio — Prototype 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap">
<style>
/* ===========================================================================
   aiRA Design System v1.1
   Type: ONE Roboto ramp, weights 400/500/600 only. Thirteen documented
   size/line-height pairs — nothing off-ramp, no 700, no letter-spacing
   anywhere except the wordmark at -0.015em.
   Spacing: 4px grid, scale values only.
   =========================================================================== */
:root{
  --aira-bg-canvas:#F6F8FA; --aira-bg-elevated:#FFFFFF; --aira-bg-surface-alt:#FBFCFD;
  --aira-bg-selected:#EEF0FF; --aira-bg-hover:#EEF1F4; --aira-bg-muted:#EEF1F4;
  --aira-bg-brand:#3438C9;
  --aira-text-primary:#111827; --aira-text-secondary:#364152; --aira-text-tertiary:#6B7785;
  --aira-text-placeholder:#9AA4B2; --aira-text-disabled:#9AA4B2;
  --aira-text-danger:#B11E1E; --aira-text-warning:#8A5500; --aira-text-info:#1F6AAA; --aira-text-success:#185C32; --aira-red:#D92D2D;
  /* Banner tone surfaces — tinted fill + tone border, read off the published design system site */
  --aira-bg-info:#E5F1FB; --aira-border-info:#BFDCF5;
  --aira-bg-warning:#FFF6E0; --aira-border-warning:#E89B1A;
  --aira-bg-success:#E7F6EC; --aira-border-success:#2A9D55;
  --aira-bg-danger:#FFECEC; --aira-border-danger:#D92D2D;
  --aira-border-default:#E2E6EB; --aira-border-brand:#3438C9; --aira-border-focus:#3438C9;
  --aira-indigo-600:#3438C9; --aira-indigo-400:#6268FF; --aira-indigo-300:#8E97FF;
  --aira-grey-400:#9AA4B2; --aira-grey-300:#C9D0D9; --aira-ink-3:#4D5867;
  --aira-label-ink:#1A2434;

  --aira-sp-1:4px; --aira-sp-2:8px; --aira-sp-3:12px; --aira-sp-4:16px;
  --aira-sp-5:20px; --aira-sp-6:24px; --aira-sp-8:32px; --aira-sp-12:48px;

  --aira-radius-sm:4px; --aira-radius-md:8px; --aira-radius-lg:12px;
  --aira-radius-xl:16px; --aira-radius-full:9999px;

  --aira-shadow-sm:0 1px 2px rgba(17,24,39,.06);
  --aira-shadow-md:0 4px 12px rgba(17,24,39,.08);
  --aira-shadow-lg:0 12px 32px rgba(17,24,39,.12);

  --motion-fast:120ms ease-out; --motion-base:200ms ease-out;

  /* Capillary product chrome — the host app's navigation, not an aiRA surface.
     Taken from the reference screenshots. */
  --cap-nav-bg:#1F1D26; --cap-nav-active:#34323D; --cap-nav-ink:#F2F3F5;
  --cap-nav-ink-dim:#B9BCC4; --cap-nav-rule:#3A3843;

  /* one stacking ladder */
  --z-canvas:6; --z-drawer:10; --z-menu:40; --z-overlay:50; --z-toast:60;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Roboto',-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;
  font:400 14px/22px 'Roboto',-apple-system,'Segoe UI',sans-serif;   /* Body md — the default body */
  background:var(--aira-bg-elevated);color:var(--aira-text-primary);overflow:hidden}
button,input,textarea{font-family:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* one global focus ring, no per-component override */
:focus-visible{outline:2px solid var(--aira-border-focus);outline-offset:2px}

#app{height:100vh;display:flex;overflow:hidden}

/* ---------- host navigation ---------- */
.nav{width:280px;flex:none;height:100%;background:var(--cap-nav-bg);display:flex;flex-direction:column;
  padding-bottom:var(--aira-sp-4);overflow-y:auto;overflow-x:hidden}
.nav.icons{width:72px}
.navtop{height:64px;flex:none;display:flex;align-items:center;gap:var(--aira-sp-2);padding:0 var(--aira-sp-5)}
.navlogo{display:flex;align-items:center;gap:var(--aira-sp-2);font:500 18px/26px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:#fff;
  letter-spacing:-0.015em;white-space:nowrap;overflow:hidden}   /* AiraWordmark: the one licensed tracking */
.nav.icons .navtop{padding:0;justify-content:center}
.nav.icons .navlogo{display:none}
.navtoggle{flex:none}
.navitem{display:flex;align-items:center;gap:var(--aira-sp-4);width:100%;height:48px;padding:0 var(--aira-sp-5);
  border:0;background:none;cursor:pointer;color:var(--cap-nav-ink-dim);font:400 15px/22px 'Roboto',-apple-system,'Segoe UI',sans-serif;text-align:left}
.navitem:hover{background:rgba(255,255,255,.06);color:var(--cap-nav-ink)}
.navitem.on{background:var(--cap-nav-active);color:#fff;font-weight:500}
.navitem .nlbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav.icons .navitem{justify-content:center;padding:0;gap:0}
.nav.icons .navitem .nlbl,.nav.icons .navchev,.nav.icons .navsub{display:none}
.navsub{display:flex;flex-direction:column;position:relative;padding-bottom:var(--aira-sp-2)}
.navsub .navitem{height:40px;padding-left:var(--aira-sp-12);font:400 14px/20px 'Roboto',-apple-system,'Segoe UI',sans-serif}
.navsubline{position:absolute;left:var(--aira-sp-8);top:0;bottom:var(--aira-sp-2);width:2px;background:var(--cap-nav-rule)}
.navrule{height:1px;background:var(--cap-nav-rule);margin:var(--aira-sp-3) var(--aira-sp-5)}
.nav.icons .navrule{margin:var(--aira-sp-3) var(--aira-sp-4)}

/* ---------- product frame ---------- */
.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;background:var(--aira-bg-canvas)}
.topbar{height:64px;flex:none;display:flex;align-items:center;gap:var(--aira-sp-3);padding:0 var(--aira-sp-6);
  background:var(--aira-bg-elevated)}
.space{display:flex;align-items:center;gap:var(--aira-sp-1);height:36px;padding:0 var(--aira-sp-2);border:0;
  border-radius:var(--aira-radius-md);background:none;cursor:pointer;font:500 16px/24px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-primary)}
.space:hover{background:var(--aira-bg-hover)}
.tbsep{width:1px;height:24px;background:var(--aira-border-default);flex:none}
.sessions{display:flex;align-items:center;gap:var(--aira-sp-2);height:36px;padding:0 var(--aira-sp-4);
  border-radius:var(--aira-radius-full);border:1px solid var(--aira-border-default);background:var(--aira-bg-elevated);
  cursor:pointer;font:500 14px/20px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-primary)}
.sessions:hover{background:var(--aira-bg-hover)}
.me{width:36px;height:36px;flex:none;border-radius:var(--aira-radius-full);border:0;background:#D6DAE0;
  color:var(--aira-text-secondary);font:500 14px/20px 'Roboto',-apple-system,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cols{flex:1;min-height:0;display:flex}

/* ---------- chat ---------- */
.chat{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
/* With an artifact panel open the chat yields whatever the canvas needs and keeps the rest.
   881 = 560 canvas floor + 320 drawer + 1 border. */
.chat.narrow{flex:0 1 auto;min-width:480px;width:clamp(480px,calc(100% - 881px),560px);
  border-right:1px solid var(--aira-border-default)}
.threadwrap{flex:1;min-height:0;position:relative;display:flex}
.thread{flex:1;min-width:0;overflow:auto;padding:var(--aira-sp-6) 0 var(--aira-sp-4)}
.tinner{max-width:608px;margin:0 auto;padding:0 var(--aira-sp-6);display:flex;flex-direction:column;gap:var(--aira-sp-6)}
.chat.narrow .tinner{max-width:none}
.turn{display:flex;flex-direction:column;gap:var(--aira-sp-3)}
.umsg{align-self:flex-end;max-width:80%;background:var(--aira-bg-muted);color:var(--aira-text-primary);
  padding:var(--aira-sp-2) var(--aira-sp-4);border-radius:var(--aira-radius-md);font:400 14px/22px 'Roboto',-apple-system,'Segoe UI',sans-serif}
.amsg{font:400 14px/22px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-primary);white-space:pre-wrap}
.amsg b,.amsg strong{font-weight:600}
.alist{margin:0;padding-left:var(--aira-sp-5);font:400 14px/22px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-primary)}
.artcard{display:flex;align-items:center;gap:var(--aira-sp-4);width:100%;padding:var(--aira-sp-4);
  border:1px solid var(--aira-border-default);border-radius:var(--aira-radius-md);
  background:var(--aira-bg-elevated);cursor:pointer;text-align:left}
.artcard:hover{background:var(--aira-bg-hover)}
.artcard .ai{width:40px;height:40px;flex:none;border-radius:var(--aira-radius-md);background:var(--aira-bg-selected);
  display:flex;align-items:center;justify-content:center}
.artcard .at{font:500 16px/24px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-primary)}
.artcard .av{font:400 13px/20px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-tertiary)}
.toolblk{background:var(--aira-bg-muted);border-radius:var(--aira-radius-md);
  padding:var(--aira-sp-3) var(--aira-sp-4);font:500 14px/22px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-primary);
  display:flex;gap:var(--aira-sp-2);align-items:flex-start}
.toolblk .tri{flex:none;margin-top:var(--aira-sp-1)}
.banner{display:flex;align-items:flex-start;gap:var(--aira-sp-3);padding:var(--aira-sp-4);
  border-radius:var(--aira-radius-md);border:1px solid var(--aira-border-default);background:var(--aira-bg-canvas)}
/* the leading icon sits level with the first line of text (glyph-centred on the 22px title line) */
.banner .bnr-ic{display:inline-flex;align-items:center;align-self:flex-start;height:22px;flex:none}
.banner .bnr-body{flex:1;min-width:0}
/* borderless dismiss, glyph level with the first line, top-right per the close-button rule */
.banner .bnr-x{flex:none;align-self:flex-start;width:24px;height:22px;display:inline-flex;align-items:center;
  justify-content:center;border:0;background:none;cursor:pointer;padding:0;border-radius:var(--aira-radius-sm);color:var(--aira-text-tertiary)}
.banner .bnr-x:hover{background:rgba(17,24,39,.06)}
.banner .bt{font:500 14px/22px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-warning)}
.banner.info{background:var(--aira-bg-info);border-color:var(--aira-border-info)}
.banner.info .bt{color:var(--aira-text-info)}
.banner.warning{background:var(--aira-bg-warning);border-color:var(--aira-border-warning)}
.banner.warning .bt{color:var(--aira-text-warning)}
.banner.success{background:var(--aira-bg-success);border-color:var(--aira-border-success)}
.banner.success .bt{color:var(--aira-text-success)}
.banner.danger{background:var(--aira-bg-danger);border-color:var(--aira-border-danger)}
.banner.danger .bt{color:var(--aira-text-danger)}
.banner .bb{font:400 13px/20px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-secondary)}

/* suggestion nudges — AiraButton secondary, size lg, pill. Click fills the composer. */
.nudges{display:flex;flex-wrap:wrap;gap:var(--aira-sp-2);margin-top:var(--aira-sp-1)}
.nudge{display:flex;align-items:center;gap:var(--aira-sp-2);height:44px;padding:0 var(--aira-sp-4);
  border:1px solid var(--aira-border-default);border-radius:var(--aira-radius-full);
  background:var(--aira-bg-elevated);cursor:pointer;font:500 15px/22px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-label-ink);
  white-space:nowrap;transition:background var(--motion-fast)}
.nudge:hover{background:var(--aira-bg-hover)}

/* ---------- composer ---------- */
.composer{flex:none;padding-bottom:var(--aira-sp-6)}
.cinner{max-width:608px;margin:0 auto;padding:0 var(--aira-sp-6);position:relative}
.chat.narrow .cinner,.chat.narrow .cardwrap{max-width:none}
.cbox{border:1px solid var(--aira-bg-brand);border-radius:var(--aira-radius-xl);background:var(--aira-bg-elevated);
  display:flex;flex-direction:column;overflow:hidden}
.cbox.pill{border-radius:var(--aira-radius-full)}
.cchips{display:flex;gap:var(--aira-sp-2);padding:var(--aira-sp-3) var(--aira-sp-3) 0;overflow-x:auto;overflow-y:hidden}
.cchips::-webkit-scrollbar{height:4px}
.cchips::-webkit-scrollbar-track{background:transparent}
.cchips::-webkit-scrollbar-thumb{background:rgba(17,24,39,.22);border-radius:2px}
.crow{display:flex;align-items:center;gap:var(--aira-sp-2);
  padding:var(--aira-sp-2) var(--aira-sp-3) var(--aira-sp-2) var(--aira-sp-4)}
.cinput{flex:1;min-width:0;min-height:36px;font:400 14px/22px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-primary);
  border:0;outline:0;background:none}
.cinput::placeholder{color:var(--aira-text-placeholder)}
.iconbtn{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;border:0;
  background:none;cursor:pointer;border-radius:var(--aira-radius-md);padding:0;color:var(--aira-text-secondary)}
.iconbtn:hover{background:var(--aira-bg-hover)}
.send{width:32px;height:32px;flex:none;border-radius:var(--aira-radius-full);display:flex;align-items:center;
  justify-content:center;background:var(--aira-bg-muted);color:var(--aira-text-disabled);border:0;cursor:pointer;padding:0}
.send.on{background:var(--aira-bg-brand);color:#fff}
.scrolldown{position:absolute;left:var(--aira-sp-6);right:var(--aira-sp-6);top:-20px;width:max-content;
  max-width:calc(100% - var(--aira-sp-12));margin-inline:auto;height:32px;padding:0 var(--aira-sp-3);
  border-radius:var(--aira-radius-full);background:var(--aira-bg-elevated);border:1px solid var(--aira-border-default);
  box-shadow:var(--aira-shadow-md);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}

/* ---------- clarification card: pinned above the composer, same width ---------- */
.cardwrap{max-width:608px;margin:0 auto var(--aira-sp-3);padding:0 var(--aira-sp-6)}
.qcard{border:1px solid var(--aira-border-default);border-radius:var(--aira-radius-lg);
  background:var(--aira-bg-elevated);box-shadow:var(--aira-shadow-md)}
.qhead{display:flex;align-items:flex-start;gap:var(--aira-sp-2);padding:var(--aira-sp-4) var(--aira-sp-4) var(--aira-sp-3)}
.qtitle{flex:1;min-width:0;font:500 16px/24px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-primary)}
.qresolved{display:flex;align-items:center;gap:var(--aira-sp-2);margin:0 var(--aira-sp-4) var(--aira-sp-3);
  padding:var(--aira-sp-2) var(--aira-sp-3);border-radius:var(--aira-radius-md);background:var(--aira-bg-selected);
  font:500 13px/20px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-indigo-600)}
.qopts{display:flex;flex-direction:column;gap:var(--aira-sp-1);padding:0 var(--aira-sp-3)}
.qopt{display:flex;align-items:center;gap:var(--aira-sp-3);width:100%;padding:var(--aira-sp-3);border:0;
  border-radius:var(--aira-radius-md);background:transparent;cursor:pointer;text-align:left;
  font:400 14px/22px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-primary)}
.qopt:hover{background:var(--aira-bg-hover)}
.qopt .qsz{margin-left:auto;font:400 12px/16px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-tertiary);flex:none}
.qtyped{display:flex;align-items:center;gap:var(--aira-sp-2);margin:var(--aira-sp-3) var(--aira-sp-3) 0;
  padding:0 var(--aira-sp-3);border:1px solid var(--aira-border-default);border-radius:var(--aira-radius-md);
  background:var(--aira-bg-canvas)}
.qtyped input{flex:1;min-width:0;height:36px;border:0;outline:0;background:none;
  font:400 14px/22px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-primary)}
.qtyped input::placeholder{color:var(--aira-text-placeholder)}
.qfoot{display:flex;align-items:center;gap:var(--aira-sp-2);padding:var(--aira-sp-3) var(--aira-sp-4) var(--aira-sp-4);
  justify-content:flex-end}

/* ---------- home ---------- */
.home{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:var(--aira-sp-6)}
.homeinner{width:100%;max-width:608px}
.greet{font:500 32px/40px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-primary);text-align:center}   /* Display md */
.sub{margin-top:var(--aira-sp-2);font:400 16px/26px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-secondary);text-align:center}
.startchips{margin-top:var(--aira-sp-4);display:flex;flex-wrap:wrap;gap:var(--aira-sp-2);justify-content:center}

/* ---------- right rail (session status) ---------- */
.rail{width:320px;flex:none;padding:var(--aira-sp-6) var(--aira-sp-6) 0;overflow-y:auto}
.railcard{border:1px solid var(--aira-border-default);border-radius:var(--aira-radius-lg);
  background:var(--aira-bg-elevated);padding:var(--aira-sp-4);display:flex;flex-direction:column;gap:var(--aira-sp-4)}
.railsec .rl{display:flex;align-items:center;gap:var(--aira-sp-1);border:0;background:none;padding:0;cursor:pointer;
  font:500 14px/20px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-primary)}
.railsec .rv{margin-top:var(--aira-sp-1);font:400 13px/20px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-tertiary)}
.railsec .rk{margin-top:var(--aira-sp-3);font:500 11px/16px 'Roboto',-apple-system,'Segoe UI',sans-serif;text-transform:uppercase;color:var(--aira-text-tertiary)}
.railrow{margin-top:var(--aira-sp-1);display:flex;align-items:center;gap:var(--aira-sp-2);
  font:400 13px/20px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-secondary)}

/* ---------- artifact panel ---------- */
.panel{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--aira-bg-elevated)}
.phead{flex:none;height:64px;display:flex;align-items:center;gap:var(--aira-sp-2);padding:0 var(--aira-sp-6)}
.phead.filerow{height:52px;border-bottom:1px solid var(--aira-border-default)}
.ptitle{flex:1;min-width:0;display:flex;align-items:baseline;gap:0;font:600 16px/24px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-primary);
  overflow:hidden;white-space:nowrap}
.ptitle .pdim{flex:none;font:400 13px/20px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-tertiary);margin-left:var(--aira-sp-2)}
.pbtn{width:32px;height:32px;flex:none;border-radius:var(--aira-radius-md);border:0;background:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:var(--aira-text-secondary)}
.pbtn:hover{background:var(--aira-bg-hover)}
.ratiolock.on{color:var(--aira-indigo-600)}
.strip{flex:none;display:flex;align-items:center;gap:var(--aira-sp-2);padding:var(--aira-sp-4) var(--aira-sp-6) var(--aira-sp-3);
  border-bottom:1px solid var(--aira-border-default)}
.hidebtn{flex:none;display:flex;align-items:center;gap:var(--aira-sp-1);border:0;background:none;cursor:pointer;
  font:500 14px/20px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-secondary);padding:0;white-space:nowrap}
.thumbs{flex:1;display:flex;gap:var(--aira-sp-2);min-width:0;overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
.thumbs::-webkit-scrollbar{height:4px}
.thumbs::-webkit-scrollbar-track{background:transparent}
.thumbs::-webkit-scrollbar-thumb{background:rgba(17,24,39,.22);border-radius:2px}
.thumb{width:48px;height:48px;flex:none;border-radius:var(--aira-radius-md);overflow:hidden;
  border:2px solid transparent;opacity:.5;padding:0;background:var(--aira-bg-canvas);cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:0}
/* overflow / gallery entry: a dashed trailing cell that opens the full gallery */
.viewall{flex:none;height:48px;padding:0 var(--aira-sp-3);border:1px dashed var(--aira-grey-300);
  border-radius:var(--aira-radius-md);background:none;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;white-space:nowrap}
.viewall:hover{background:var(--aira-bg-hover);border-color:var(--aira-indigo-600)}
.viewall .va1{font:500 13px/16px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-indigo-600)}
.viewall .va2{font:400 11px/14px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-tertiary)}
.thumb:hover{opacity:.85}
.thumb.on{border-color:var(--aira-border-brand);opacity:1}
.tcell{position:relative;flex:none;border-radius:var(--aira-radius-md)}
/* Google-Photos hover select on the strip: the circle selects, it never changes the active image */
.tcheck{position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:var(--aira-radius-full);border:0;padding:0;

.work{flex:1;min-height:0;display:flex;min-width:0}

/* The canvas: a TRACK between the scroller and the image, sized max(100%, content).
   Centring inside a box that can never be smaller than its child means the free space
   is never negative — so no part of the image is pushed past the scroller's start edge
   where scrollLeft cannot reach it. */
.canvaswrap{flex:1;min-width:0;position:relative;overflow:hidden;background:var(--aira-bg-surface-alt);
  container-type:inline-size}
.canvasarea{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;display:block}
.canvastrack{min-width:100%;min-height:100%;width:max-content;height:max-content;display:flex;
  align-items:center;justify-content:center;padding:var(--aira-sp-6) var(--aira-sp-6) 80px}
.imgframe{position:relative;flex:none;line-height:0}
.imgframe.arming{cursor:crosshair}
.imgframe.zoomable{cursor:zoom-in}
.imgshadow{position:relative;border-radius:var(--aira-radius-md);overflow:hidden;
  box-shadow:var(--aira-shadow-lg);line-height:0}
.genwrap{position:relative;border-radius:var(--aira-radius-md);overflow:hidden;box-shadow:var(--aira-shadow-lg)}
.gennote{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:var(--aira-sp-2);
  padding:var(--aira-sp-2) var(--aira-sp-4);border-radius:var(--aira-radius-full);background:var(--aira-bg-elevated);
  box-shadow:var(--aira-shadow-md);font:500 14px/20px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-secondary)}
.gennote .spin{border-color:var(--aira-indigo-300);border-top-color:var(--aira-indigo-600)}
.cropframe{position:absolute;border:1.5px solid #fff;box-shadow:0 0 0 9999px rgba(17,24,39,.45);
  border-radius:2px;pointer-events:none;z-index:4}
.cropframe .ch{position:absolute;width:12px;height:12px;border:2px solid #fff}
.cropframe:not(.live) .tl{left:-2px;top:-2px;border-right:0;border-bottom:0}
.cropframe:not(.live) .tr{right:-2px;top:-2px;border-left:0;border-bottom:0}
.cropframe:not(.live) .bl{left:-2px;bottom:-2px;border-right:0;border-top:0}
.cropframe:not(.live) .br{right:-2px;bottom:-2px;border-left:0;border-top:0}
/* Freeform: draggable frame with grabbable knob handles on all eight points */
.cropframe.live{pointer-events:auto;cursor:move}
.cropframe.live .ch{width:14px;height:14px;border:0;background:#fff;border-radius:3px;
  box-shadow:0 1px 3px rgba(0,0,0,.45);pointer-events:auto;z-index:5}
.cropframe.live .tl{left:-7px;top:-7px;cursor:nwse-resize}
.cropframe.live .tr{right:-7px;top:-7px;cursor:nesw-resize}
.cropframe.live .bl{left:-7px;bottom:-7px;cursor:nesw-resize}
.cropframe.live .br{right:-7px;bottom:-7px;cursor:nwse-resize}
.cropframe.live .t{left:50%;top:-7px;transform:translateX(-50%);cursor:ns-resize}
.cropframe.live .b{left:50%;bottom:-7px;transform:translateX(-50%);cursor:ns-resize}
.cropframe.live .l{left:-7px;top:50%;transform:translateY(-50%);cursor:ew-resize}
.cropframe.live .r{right:-7px;top:50%;transform:translateY(-50%);cursor:ew-resize}
/* A floating bar with both edges pinned can never overflow its band: max-width caps it
   and the auto margins centre whatever is left. */
.tools{position:absolute;left:var(--aira-sp-4);right:var(--aira-sp-4);bottom:var(--aira-sp-4);
  width:max-content;max-width:calc(100% - var(--aira-sp-8));margin-inline:auto;
  display:flex;align-items:center;gap:var(--aira-sp-2);padding:var(--aira-sp-1);
  background:var(--aira-bg-elevated);border:1px solid var(--aira-border-default);
  border-radius:var(--aira-radius-md);box-shadow:var(--aira-shadow-lg);z-index:var(--z-canvas)}
.tbtn{width:32px;height:32px;flex:none;border-radius:var(--aira-radius-md);display:flex;align-items:center;
  justify-content:center;border:0;background:none;cursor:pointer;padding:0;color:var(--aira-text-secondary)}
.tbtn:hover{background:var(--aira-bg-hover)}
.tbtn[disabled]{opacity:.35;cursor:default}
.tool{display:flex;flex:none;white-space:nowrap;align-items:center;gap:var(--aira-sp-2);height:32px;
  padding:0 var(--aira-sp-3);border-radius:var(--aira-radius-md);font:500 14px/20px 'Roboto',-apple-system,'Segoe UI',sans-serif;
  background:transparent;color:var(--aira-text-secondary);border:0;cursor:pointer}

.zoom{font:500 12px/16px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-secondary);min-width:40px;text-align:center;flex:none}
/* Condense rather than widen or clip, per the standing overflow rule. */
@container (max-width:559px){
  .tool{width:32px;padding:0;justify-content:center}
  .tool .tlabel{display:none}
}
.hint{position:absolute;left:var(--aira-sp-4);right:var(--aira-sp-4);top:var(--aira-sp-4);width:max-content;
  max-width:calc(100% - var(--aira-sp-8));margin-inline:auto;z-index:var(--z-canvas);display:flex;

  font:500 13px/20px 'Roboto',-apple-system,'Segoe UI',sans-serif;pointer-events:none}

/* ---------- drawers ---------- */
aside.drawer{flex:none;width:320px;min-width:320px;height:100%;background:var(--aira-bg-elevated);

.btn.tertiary{background:transparent;color:var(--aira-text-secondary);border-color:transparent}

.btn.lg{height:44px;padding:0 var(--aira-sp-5);font:500 15px/22px 'Roboto',-apple-system,'Segoe UI',sans-serif}
.btn.pillchip{height:44px;padding:0 var(--aira-sp-4);border-radius:var(--aira-radius-full);
  border-color:var(--aira-border-default);background:var(--aira-bg-elevated);color:var(--aira-label-ink);
  font:500 15px/22px 'Roboto',-apple-system,'Segoe UI',sans-serif}
.btn.pillchip:hover{background:var(--aira-bg-hover)}
.lbl{font:500 11px/16px 'Roboto',-apple-system,'Segoe UI',sans-serif;text-transform:uppercase;color:var(--aira-text-tertiary)}
.fieldlbl{font:500 12px/16px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-secondary)}
.input{height:36px;border:1px solid var(--aira-border-default);border-radius:var(--aira-radius-md);
  padding:0 var(--aira-sp-3);font:400 14px/22px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-primary);width:100%;
  background:var(--aira-bg-elevated)}
.input::placeholder{color:var(--aira-text-placeholder)}
.exrow{display:flex;align-items:center;gap:var(--aira-sp-3);padding:var(--aira-sp-2) 0;
  border-radius:var(--aira-radius-md);border-bottom:1px solid var(--aira-bg-muted)}
.exrow .nm{font:500 14px/20px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.xbtn{flex:none;width:32px;height:32px;border-radius:var(--aira-radius-md);display:flex;align-items:center;
  justify-content:center;border:0;background:none;cursor:pointer;color:var(--aira-text-secondary);opacity:0}
.exrow:hover .xbtn,.xbtn:focus-visible{opacity:1}
.tplgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--aira-sp-2);padding-bottom:var(--aira-sp-2)}
.tpl{border:1px solid var(--aira-border-default);border-radius:var(--aira-radius-md);background:var(--aira-bg-elevated);
  padding:var(--aira-sp-3) var(--aira-sp-2);display:flex;flex-direction:column;align-items:center;
  gap:var(--aira-sp-1);cursor:pointer}

.grouphd{display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:var(--aira-sp-2) 0;border:0;background:none;cursor:pointer}

/* ---------- gallery ---------- */
.gallery{position:absolute;inset:0;background:var(--aira-bg-surface-alt);z-index:var(--z-overlay);
  display:flex;flex-direction:column}
.gallhead{display:flex;align-items:center;gap:var(--aira-sp-3);padding:var(--aira-sp-4) var(--aira-sp-6);
  border-bottom:1px solid var(--aira-border-default);background:var(--aira-bg-elevated)}
.gallgrid{flex:1;overflow:auto;padding:var(--aira-sp-6) var(--aira-sp-6) var(--aira-sp-8);display:grid;
  grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:var(--aira-sp-4);align-content:start}
.gcard{position:relative;display:flex;flex-direction:column;border:0;border-radius:var(--aira-radius-lg);
  background:none;padding:0;text-align:left}

  cursor:pointer;border:1px solid var(--aira-border-default);transition:transform var(--aira-motion-fast)}
.gthumb .gpic{aspect-ratio:1;display:flex;align-items:center;justify-content:center;line-height:0}
.gcard.sel .gthumb{transform:scale(.9);border-color:var(--aira-border-brand);box-shadow:0 0 0 2px var(--aira-border-brand)}
/* Google-Photos-style select circle: top-left, appears on hover, always shown once anything is selected */
.gcheck{position:absolute;right:var(--aira-sp-2);top:var(--aira-sp-2);width:24px;height:24px;border-radius:var(--aira-radius-full);
  border:0;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;
  transition:opacity var(--aira-motion-fast);z-index:2;background:rgba(17,24,39,.28)}
.gcheck::before{content:"";position:absolute;inset:0;border-radius:var(--aira-radius-full);border:2px solid #fff}
.gthumb:hover .gcheck,.gallery.selecting .gcheck,.gcard.sel .gcheck{opacity:1}
.gcheck.on{background:var(--aira-bg-brand)}
.gcheck.on::before{border-color:var(--aira-bg-brand)}
.gcap{padding:var(--aira-sp-2) var(--aira-sp-1) 0;min-width:0}
.gname{font:500 14px/20px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmeta{font:400 13px/18px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-tertiary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emptyblk{min-height:280px;grid-column:1/-1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:var(--aira-sp-3);text-align:center}

  align-items:center;justify-content:center;padding:var(--aira-sp-6)}
.pcard{width:280px;flex:none;border:2px solid var(--aira-border-default);border-radius:var(--aira-radius-lg);
  overflow:hidden;background:var(--aira-bg-elevated);padding:0;line-height:0;cursor:pointer;display:block}
.pcard:hover,.pcard:focus-visible{border-color:var(--aira-border-brand);box-shadow:var(--aira-shadow-lg)}

/* ---------- misc ---------- */
.toast{position:absolute;left:var(--aira-sp-4);right:var(--aira-sp-4);bottom:76px;width:max-content;
  max-width:calc(100% - var(--aira-sp-8));margin-inline:auto;z-index:var(--z-toast);display:flex;
  align-items:center;gap:var(--aira-sp-3);min-height:44px;padding:0 var(--aira-sp-3) 0 var(--aira-sp-4);
  border-radius:var(--aira-radius-md);background:var(--aira-bg-elevated);border:1px solid var(--aira-border-default);
  box-shadow:var(--aira-shadow-lg);font:500 14px/20px 'Roboto',-apple-system,'Segoe UI',sans-serif;color:var(--aira-text-primary)}
.skel{background:linear-gradient(100deg,var(--aira-bg-muted) 25%,var(--aira-border-default) 37%,var(--aira-bg-muted) 63%);
  background-size:400% 100%;animation:shim 1.6s ease-in-out infinite;border-radius:var(--aira-radius-md)}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.spin{width:14px;height:14px;flex:none;border-radius:var(--aira-radius-full);
  border:2px solid currentColor;border-top-color:transparent;animation:sp .8s linear infinite;opacity:.9}
@keyframes sp{to{transform:rotate(360deg)}}

  border-radius:var(--aira-radius-sm)}
.areabox.dim{border-color:rgba(98,104,255,.65);background:rgba(98,104,255,.06)}
.areabox.live{border-style:dashed;background:rgba(98,104,255,.18)}

  display:flex;align-items:center;justify-content:center;font:500 12px/16px 'Roboto',-apple-system,'Segoe UI',sans-serif}
.areahit{position:absolute;border-radius:var(--aira-radius-sm)}
.areax{position:absolute;width:32px;height:32px;border-radius:var(--aira-radius-full);
  background:rgba(17,24,39,.78);color:#fff;display:none;align-items:center;justify-content:center;

.livesize{position:absolute;padding:var(--aira-sp-1) var(--aira-sp-2);border-radius:var(--aira-radius-sm);

  display:flex;align-items:center;justify-content:center}
.chipnum{position:absolute;left:var(--aira-sp-2);bottom:var(--aira-sp-2);height:20px;min-width:20px;
  padding:0 var(--aira-sp-1);border-radius:var(--aira-radius-sm);background:var(--aira-bg-brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font:500 11px/16px 'Roboto',-apple-system,'Segoe UI',sans-serif}
.chipx{position:absolute;right:var(--aira-sp-1);top:var(--aira-sp-1);width:32px;height:32px;
  border-radius:var(--aira-radius-full);background:rgba(17,24,39,.78);color:#fff;display:none;
  align-items:center;justify-content:center;border:0;cursor:pointer;padding:0}
.chip:hover .chipx,.chipx:focus-visible{display:flex}
.dropdown{position:absolute;z-index:var(--z-menu);background:var(--aira-bg-elevated);
  border:1px solid var(--aira-border-default);border-radius:var(--aira-radius-lg);
  box-shadow:var(--aira-shadow-lg);overflow-y:auto;max-height:280px;padding:var(--aira-sp-1)}
.ddrow{display:flex;align-items:center;justify-content:space-between;gap:var(--aira-sp-3);
  padding:var(--aira-sp-2) var(--aira-sp-3);border-radius:var(--aira-radius-md);width:100%;border:0;

.ddrow.on{background:var(--aira-bg-selected);color:var(--aira-indigo-600)}

/* ---------- md and below: rail nav, one panel ---------- */
/* Tablet / a retina-fullscreen artifact (~960 CSS px): keep BOTH columns — just force the host
   rail to its icon width so chat + panel + drawer still fit. The panel must never vanish here. */
@media (max-width:1023px){
  .nav{width:72px}
  .nav .navlogo{display:none}
  .nav .navtop{justify-content:center;padding:0}
  .nav .navitem{justify-content:center;padding:0;gap:0}
  .nav .navitem .nlbl,.nav .navchev,.nav .navsub{display:none}
  .chat.narrow{min-width:0;width:clamp(300px,calc(100% - 392px),480px)}
}
/* Phone: one panel at a time — the artifact panel replaces the chat, close returns to it. */
@media (max-width:767px){
  .nav{position:absolute;top:0;bottom:0;left:0;z-index:var(--z-overlay);transform:translateX(-100%);
    transition:transform var(--motion-base)}
  .nav.open{transform:none;width:280px}
  .nav.open .navlogo,.nav.open .navitem .nlbl,.nav.open .navsub{display:revert}
  .chat.narrow{width:auto;flex:1;min-width:0;border-right:0}
  .panel{display:none}
  .cols.showpanel .chat{display:none}
  .cols.showpanel .panel{display:flex}
  aside.drawer{position:absolute;left:0;right:0;bottom:0;top:auto;width:auto;min-width:0;height:auto;
    max-height:70%;border-left:0;border-top:1px solid var(--aira-border-default);
    border-radius:var(--aira-radius-lg) var(--aira-radius-lg) 0 0;box-shadow:var(--aira-shadow-lg)}
}

<body>

const PALETTE = {

  night:['#101A3A','#22346E','#E0A83C'], dusk:['#4A1330','#8A2D4E','#E08A3C'],

function creative(w, h, o) {
  o = o || {}; h = h || w;
  const p = PALETTE[o.tone || 'warm'], g = 'cr' + (++uid);
  const u = Math.min(w, h) / 100;              // one unit = 1% of the short edge
  const wide = w / h > 1.6;                    // banner-shaped: the model panel goes, type runs across
  const r = (x, y, ww, hh, f, rad) =>
    `<rect x="${x}" y="${y}" width="${Math.max(0, ww)}" height="${Math.max(0, hh)}" rx="${rad || 0}" fill="${f}"/>`;
  const pad = 5 * u;
  const bunt = Math.max(3, Math.round(w / (14 * u)));
  const panelW = wide ? 0 : 0.3 * w, panelX = w - panelW - pad;
  const cx = panelX + panelW / 2;
  const txtW = (wide ? 0.56 : 0.62) * w - pad;
  const cover = o.cover
    ? `width="100%" height="100%" preserveAspectRatio="xMidYMid slice" style="display:block;width:100%;height:100%"`
    : `width="${w}" height="${h}" style="display:block"`;
  return `<svg ${cover} viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <defs><linearGradient id="${g}" x1="0" y1="0" x2=".45" y2="1">
      <stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient>
      <radialGradient id="${g}g" cx="${wide ? .8 : .66}" cy=".4" r=".55">
      <stop offset="0" stop-color="${p[2]}" stop-opacity=".5"/>
      <stop offset="1" stop-color="${p[2]}" stop-opacity="0"/></radialGradient></defs>
    ${r(0, 0, w, h, 'url(#' + g + ')')}
    ${r(0, 0, w, h, 'url(#' + g + 'g)')}
    ${r(0, 0, w, 0.9 * u, p[2])}
    ${Array.from({length: bunt}, (_, i) => {
      const x = (i + .5) * (w / bunt);
      return `<circle cx="${x}" cy="${(i % 2 ? 4 : 2.6) * u}" r="${1.7 * u}" fill="${p[2]}" opacity=".9"/>`;
    }).join('')}
    ${panelW ? r(panelX, 0.16 * h, panelW, 0.72 * h, 'rgba(255,255,255,.13)', 2.4 * u) : ''}
    ${panelW ? `<ellipse cx="${cx}" cy="${0.33 * h}" rx="${panelW * .29}" ry="${0.1 * h}" fill="rgba(255,255,255,.2)"/>
      <ellipse cx="${cx}" cy="${0.58 * h}" rx="${panelW * .38}" ry="${0.15 * h}" fill="rgba(255,255,255,.15)"/>` : ''}
    ${r(pad, 0.09 * h, Math.min(txtW, 30 * u), 7 * u, 'rgba(255,255,255,.93)', 1 * u)}
    <text x="${pad + 2.6 * u}" y="${0.09 * h + 4.9 * u}" font-family="Roboto,sans-serif" font-weight="600"
      font-size="${3.2 * u}" letter-spacing="${0.16 * u}" fill="${p[0]}">PANTALOONS</text>
    ${r(pad, 0.52 * h, txtW, 4.4 * u, 'rgba(255,255,255,.92)', 0.8 * u)}
    ${r(pad, 0.52 * h + 6.4 * u, txtW * .68, 3.4 * u, 'rgba(255,255,255,.6)', 0.8 * u)}
    ${r(pad, 0.68 * h, Math.min(txtW, 34 * u), 11 * u, p[2], 1.6 * u)}
    <text x="${pad + 3 * u}" y="${0.68 * h + 7.8 * u}" font-family="Roboto,sans-serif" font-weight="600"
      font-size="${6.4 * u}" fill="${p[0]}">50% OFF</text>
    ${r(pad, 0.86 * h, txtW * .52, 3 * u, 'rgba(255,255,255,.45)', 0.8 * u)}
    ${r(pad, 0.92 * h, 22 * u, 5 * u, 'rgba(255,255,255,.9)', 2.5 * u)}
  </svg>`;
}
/* contain-fit an image's real shape inside a box, so nothing is ever cropped */
function fit(boxW, boxH, im) {
  const a = (im && im.w ? im.w : 1) / (im && im.h ? im.h : 1);
  let w = boxW, h = boxW / a;
  if (h > boxH) { h = boxH; w = boxH * a; }
  return {w: Math.round(w), h: Math.round(h)};
}

/* one owner for every timer, so a cancelled action can never report success later */
function later(kind, ms, fn) {
  clearLater(); S.tmrKind = kind;
  S.tmr = setTimeout(() => { if (S.tmrKind !== kind) return; S.tmr = null; S.tmrKind = null; fn(); }, ms);
}
function clearLater() { if (S.tmr) clearTimeout(S.tmr); S.tmr = null; S.tmrKind = null; }
function toast(text) {
  S.toast = text; const id = ++S.toastId;
  setTimeout(() => { if (S.toastId === id && S.toast === text) { S.toast = null; render(); } }, 4200);
}
function imgOf(i) { return S.images[i] || S.images[0]; }

  return `<div class="chip" title="Area ${a.n} · ${a.px}">
    <div style="position:absolute;left:${-a.x * s + (84 - a.w * s) / 2}px;top:${-a.y * s + (64 - a.h * s) / 2}px">${creative(420 * s, im)}</div>

}

  if (S.stage === 'editor' && S.images.length)

function tplIcon(w, h) {

/* ===================== render ===================== */
function render() {
  if (S.stage === 'editor' && !S.images.length) S.stage = null;   // the flags can never disagree
  if (S.stage !== 'editor') S.panel = null;
  const im = imgOf(S.active);
  const narrow = !!S.stage;
  const ph = S.view === 'home' ? 'What’s our mission today?'
    : S.stage === 'picker' ? 'Pick a concept, or ask for two more…'
    : S.stage === 'editor' ? 'Ask aiRA to change this image…'
    : S.needFormat ? 'Tell me what it’s for, or ask for something else…'
    : 'Describe the image you need';

  const chatCol = `<div class="chat${narrow ? ' narrow' : ''}">
      ${narrow ? '' : `<div style="position:absolute;right:24px;top:20px;z-index:2">
        <button class="iconbtn" data-act="noop" aria-label="Share this session">${ic(I.share, {s: 20, c: '#4D5867'})}</button></div>`}
      <div class="threadwrap"><div class="thread" id="thread"><div class="tinner">${threadHTML()}</div></div></div>
      <div class="composer">${cardHTML()}<div class="cinner">
        ${S.stick ? '' : `<button class="scrolldown" data-act="to-bottom" aria-label="Scroll to the newest message">${ic(I.chevD, {s: 20, c: '#4D5867'})}</button>`}
        ${composerHTML(ph)}</div></div>
    </div>`;

  let cols;
  if (S.view === 'home') cols = homeHTML();
  else if (!narrow) cols = `<div class="cols">${chatCol}${railHTML()}</div>`;
  else cols = `<div class="cols showpanel">${chatCol}${
      S.stage === 'picker'
        ? `<div class="panel"><div class="phead"><span class="ptitle">Two concepts</span>
             <button class="iconbtn" data-act="art-close" aria-label="Close panel">${ic(I.x, {s: 20, c: '#4D5867'})}</button></div>
           <div class="canvaswrap">${pickerSurface()}</div></div>`
        : `<div class="panel">
            ${stripHTML()}
            <div class="phead filerow"><span class="ptitle">${esc(im ? im.name : '')} <span class="pdim">${im ? im.w : 0} &#215; ${im ? im.h : 0} px</span></span>
              <button class="pbtn" data-act="export" aria-label="Export">${ic(I.dl, {s: 20, c: '#364152'})}</button>
              <button class="pbtn" data-act="copy-img" aria-label="Copy image to clipboard">${ic(S.copied ? I.check : I.copy, {s: 20, c: S.copied ? '#3438C9' : '#364152'})}</button>
              <button class="iconbtn" data-act="art-close" aria-label="Close panel">${ic(I.x, {s: 20, c: '#4D5867'})}</button></div>
            <div class="work"><div class="canvaswrap">${canvasHTML()}</div>
              ${S.panel === 'resize' ? resizeDrawer() : S.panel === 'export' ? exportDrawer() : ''}</div>
          </div>`}</div>`;

  $('app').innerHTML = navHTML() + `<div class="main">${topbarHTML()}${cols}
    ${S.gallery ? galleryHTML() : ''}
    ${S.preview ? `<div style="position:absolute;inset:0;background:rgba(17,24,39,.88);z-index:70;display:flex;
        align-items:center;justify-content:center" data-act="preview-off">
        <div style="line-height:0">${(f => creative(f.w, f.h, im))(fit(window.innerWidth - 160, window.innerHeight - 160, im))}</div>
        <button class="iconbtn" data-act="preview-off" style="position:absolute;right:24px;top:24px" aria-label="Close preview">${ic(I.x, {s: 20, c: '#fff'})}</button></div>` : ''}
  </div>`;
  bind(); bindDrag(); bindCrop(); restoreScroll(); restoreFocus();
  if (S.refit) { S.refit = false; if (refit()) render(); }   // measure once the canvas exists
}
function restoreScroll() {
  const t = $('thread'); if (t && S.stick) t.scrollTop = t.scrollHeight;
  const e = $('exscroll'); if (e) { S.listScroll = Math.max(0, Math.min(S.listScroll, e.scrollHeight - e.clientHeight)); e.scrollTop = S.listScroll; }
}
function restoreFocus() {
  if (!S.focusAfter) return;
  const k = S.focusAfter; S.focusAfter = null;
  const el = /^[#\[.]/.test(k) ? document.querySelector(k) : ($(k) || document.querySelector('[data-act="' + k + '"]'));
  if (el && el.focus) { el.focus(); if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); }
}

/* ===================== interactions ===================== */
function bind() {
  const app = $('app');
  app.querySelectorAll('[data-act]').forEach(el => {
    el.onclick = ev => { ev.stopPropagation(); act(el.getAttribute('data-act'), el); }; });
  const c = $('composer'); if (c) {
    c.oninput = e => { S.draft = e.target.value; paintSend(); };
    c.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); act('send'); } }; }
  const q = $('qtyped'); if (q) {
    q.oninput = e => { S.card.typed = e.target.value; };
    q.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); act('q-typed'); } }; }
  const rq = $('rzq'); if (rq) rq.oninput = e => { S.rzSearch = e.target.value; S.focusAfter = 'rzq'; render(); };
  const syncCrop = () => { const im = imgOf(S.active);
    const fw = Math.max(.02, Math.min(1, S.rzW / im.w)), fh = Math.max(.02, Math.min(1, S.rzH / im.h));
    S.crop = {fx: (1 - fw) / 2, fy: (1 - fh) / 2, fw, fh}; };
  const rw = $('rzw'); if (rw) rw.oninput = e => { S.rzW = +e.target.value || 0; S.rzPick = null; S.rzNoteX = false;
    if (S.rzLock && S.rzLockR) S.rzH = Math.max(1, Math.round(S.rzW / S.rzLockR)); syncCrop(); S.focusAfter = 'rzw'; render(); };
  const rh = $('rzh'); if (rh) rh.oninput = e => { S.rzH = +e.target.value || 0; S.rzPick = null; S.rzNoteX = false;
    if (S.rzLock && S.rzLockR) S.rzW = Math.max(1, Math.round(S.rzH * S.rzLockR)); syncCrop(); S.focusAfter = 'rzh'; render(); };
  const n = $('exname'); if (n) n.oninput = e => { S.exName = e.target.value; };
  const ex = $('exscroll'); if (ex) ex.onscroll = () => { S.listScroll = ex.scrollTop; };
  const th = $('thread'); if (th) th.onscroll = () => {
    const near = th.scrollHeight - th.scrollTop - th.clientHeight < 40;
    if (near !== S.stick) { S.stick = near; const b = document.querySelector('[data-act="to-bottom"]');
      if (!b || !near) render(); } };
  // Click outside the editor — i.e. bare chat space beside it — closes the editor. Clicking a
  // message, card, nudge, the composer or any control is spared, so only empty space closes.
  // Clicking outside an open drawer (resize/export) closes just that drawer — never the editor,
  // which only the header close (X) shuts. The image, its crop frame and the floating toolbar are
  // spared so dragging a crop out on the canvas doesn't dismiss the drawer mid-gesture.
  if (S.panel) { const cols = document.querySelector('.cols'); if (cols) {
    cols.onclick = e => {
      if (e.target.closest('aside.drawer, #iframe, #imgsq, .tools, .cropframe, button, a, input, textarea, [data-act]')) return;
      S.panel = null; S.tool = null; S.refit = true; render();
    }; } }
}
function paintSend() {
  const b = document.querySelector('[data-act="send"]'); if (!b) return;
  const hot = !!(S.draft || (S.areas.length && !S.sent));
  b.classList.toggle('on', hot);
  b.innerHTML = ic(I.up, {s: 20, c: hot ? '#fff' : '#9AA4B2', w: 1.9});
}

/* ---------- resize: a draggable / resizable Freeform crop frame ---------- */
function bindCrop() {
  const fr = $('cropframe'); if (!fr) return;
  const sq = $('imgsq'); if (!sq) return;
  const im = imgOf(S.active);
  const tpl = S.rzPick ? TPLS.find(x => x.n === S.rzPick) : null;
  const lockR = tpl ? (tpl.w / tpl.h) * (im.h / im.w) : (S.rzLock && S.rzLockR ? S.rzLockR * im.h / im.w : null);
  const minW = Math.min(1, MIN_PX / im.w), minH = Math.min(1, MIN_PX / im.h);
  const start = (ev, mode) => {
    ev.preventDefault(); ev.stopPropagation();
    const r = sq.getBoundingClientRect();
    const c0 = Object.assign({fx: 0, fy: 0, fw: 1, fh: 1}, S.crop);
    const px = ev.clientX, py = ev.clientY;
    const move = e => {
      const dx = (e.clientX - px) / r.width, dy = (e.clientY - py) / r.height;
      let {fx, fy, fw, fh} = c0;
      if (mode === 'move') {
        fx = Math.max(0, Math.min(1 - fw, c0.fx + dx));
        fy = Math.max(0, Math.min(1 - fh, c0.fy + dy));
      } else {
        if (mode.indexOf('l') >= 0) { const nx = Math.max(0, Math.min(c0.fx + c0.fw - minW, c0.fx + dx)); fw = c0.fx + c0.fw - nx; fx = nx; }
        if (mode.indexOf('r') >= 0) { fw = Math.max(minW, Math.min(1 - c0.fx, c0.fw + dx)); }
        if (mode.indexOf('t') >= 0) { const ny = Math.max(0, Math.min(c0.fy + c0.fh - minH, c0.fy + dy)); fh = c0.fy + c0.fh - ny; fy = ny; }
        if (mode.indexOf('b') >= 0) { fh = Math.max(minH, Math.min(1 - c0.fy, c0.fh + dy)); }
        if (lockR) {                                 // hold the aspect ratio, anchored at the opposite edge
          const fracR = lockR;                       // fw/fh in fraction space
          const widthDriven = (mode === 'l' || mode === 'r' || mode.length === 2);
          if (widthDriven) fh = fw / fracR; else fw = fh * fracR;
          if (mode.indexOf('t') >= 0) fy = c0.fy + c0.fh - fh;
          else if (mode === 'l' || mode === 'r') fy = c0.fy + (c0.fh - fh) / 2;
          else fy = c0.fy;
          if (mode.indexOf('l') >= 0) fx = c0.fx + c0.fw - fw;
          else if (mode === 't' || mode === 'b') fx = c0.fx + (c0.fw - fw) / 2;
          else fx = c0.fx;
          fw = Math.min(fw, 1); fh = Math.min(fh, 1);
          fx = Math.max(0, Math.min(1 - fw, fx)); fy = Math.max(0, Math.min(1 - fh, fy));
        }
      }
      S.crop = {fx, fy, fw, fh};
      if (!S.rzPick) {                             // a template's output size is fixed; only Freeform tracks the region
        S.rzW = Math.round(fw * im.w); S.rzH = Math.round(fh * im.h);
        const wI = $('rzw'), hI = $('rzh'); if (wI) wI.value = S.rzW; if (hI) hI.value = S.rzH;
      }
      fr.style.left = fx * r.width + 'px'; fr.style.top = fy * r.height + 'px';
      fr.style.width = fw * r.width + 'px'; fr.style.height = fh * r.height + 'px';
    };
    const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); render(); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };
  fr.onpointerdown = e => { if (e.target.dataset && e.target.dataset.h) return; start(e, 'move'); };
  fr.querySelectorAll('.ch').forEach(hd => hd.onpointerdown = e => start(e, hd.dataset.h));
}

/* ---------- select area: real pointer drag ---------- */
function bindDrag() {
  const fr = $('iframe'); if (!fr) return;
  fr.onpointerdown = ev => {
    if (S.tool !== 'area' || S.sent || S.rzBusy || S.busy) return;
    if (ev.target.closest && ev.target.closest('.areax')) return;   // the close button is not a canvas
    const sq = $('imgsq'); if (!sq) return;
    ev.preventDefault();
    const r = sq.getBoundingClientRect();
    const cl = v => Math.max(0, Math.min(1, v));
    const fx0 = cl((ev.clientX - r.left) / r.width), fy0 = cl((ev.clientY - r.top) / r.height);
    const box = $('livebox'), lab = $('livesize'), im = imgOf(S.active);
    let cur = null;
    const move = e => {
      const fx1 = cl((e.clientX - r.left) / r.width), fy1 = cl((e.clientY - r.top) / r.height);
      cur = {fx: Math.min(fx0, fx1), fy: Math.min(fy0, fy1),
             fw: Math.abs(fx1 - fx0), fh: Math.abs(fy1 - fy0)};
      const px = Math.round(cur.fw * im.w) + ' × ' + Math.round(cur.fh * im.h) + ' px';
      box.style.display = 'block';
      box.style.left = cur.fx * r.width + 'px'; box.style.top = cur.fy * r.height + 'px';
      box.style.width = cur.fw * r.width + 'px'; box.style.height = cur.fh * r.height + 'px';
      lab.style.display = 'block'; lab.textContent = px;            // live while dragging, never after
      lab.style.left = cur.fx * r.width + 'px';
      lab.style.top = Math.max(0, cur.fy * r.height - 24) + 'px';
    };
    const up = () => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
      if (box) { box.style.display = 'none'; } if (lab) { lab.style.display = 'none'; }
      if (!cur || cur.fw < .02 || cur.fh < .02) return;            // a stray click is not a box
      S.areaSeq++;                                                  // numbers never reflow
      S.areas.push({n: S.areaSeq, fx: cur.fx, fy: cur.fy, fw: cur.fw, fh: cur.fh, img: im.id,
        px: Math.round(cur.fw * im.w) + ' × ' + Math.round(cur.fh * im.h) + ' px'});
      S.focusAfter = '#composer';
      render();
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };
}

/* ---------- turns ---------- */
function hasFormat(t) { const s = t.toLowerCase(); return FORMAT_WORDS.some(w => s.includes(w)); }
function conceptPair() { const a = TONES[S.genCount % 4], b = TONES[(S.genCount + 1) % 4];
  return [{tone: a}, {tone: b}]; }
function openCard(q, group, resolved) { S.card = {q: q, group: group || null, resolved: resolved || null, typed: ''}; S.needFormat = true; }

function firstGen(label) {
  S.card = null; S.needFormat = false; S.fmtChoice = label;
  const t = TPLS.find(x => x.n === label) || TPLS[7];
  S.pending = {w: t.w, h: t.h, name: t.n};
  S.busy = true; S.stage = null; S.stick = true;
  tool('Loading playbook: image_generation…');
  say('Two directions at ' + t.w + ' × ' + t.h + ' px for ' + t.n.toLowerCase() + ', both leading with the 50% offer.');
  S.msgs.push({t: 'skel', h: 56});
  render();                                    // show the generating state, not just schedule it
  later('gen', 1700, () => {
    S.busy = false; S.genCount++;
    S.msgs = S.msgs.filter(m => m.t !== 'skel');
    S.concepts = conceptPair(); S.stage = 'picker';
    render();
  });
}
function startRegen() {
  S.regen = true; S.stage = 'picker'; S.stick = true; render();
  later('regen', 1700, () => { S.regen = false; S.genCount += 2; S.concepts = conceptPair();
    say('Two fresh directions. That spent 2 credits — rerolling replaces both.'); render(); });
}
function startEdit(text) {
  S.busy = true; S.stick = true; S.msgs.push({t: 'skel', h: 56});
  const areas = S.areas.slice(); render();
  later('edit', 1700, () => {
    S.busy = false; S.genCount++;
    S.msgs = S.msgs.filter(m => m.t !== 'skel');
    if (S.genCount % 5 === 0) {                        // a real failure is reachable, not hypothetical
      S.msgs.push({t: 'banner', danger: true, title: 'Couldn’t finish that edit',
        body: 'The image is unchanged and nothing was spent.', action: 'Try again'});
      render(); return;
    }
    const prev = imgOf(S.active);
    snapshot();
    const im = mkImage({w: prev.w, h: prev.h, tone: prev.tone, ver: 'v' + (S.images.length + 1),
      name: 'aira_gen_pantaloons_diwali_v' + (S.images.length + 1) + '.png'});
    S.images.push(im); S.active = S.images.length - 1; S.page = Math.floor(S.active / 10);
    S.areas = []; S.sent = false; S.tool = null; S.refit = true;   // regions consumed by the turn that used them
    S.stage = 'editor';
    S.msgs.push({t: 'card', title: 'Pantaloons Diwali sale creative', ver: im.ver, img: im.id});
    say(areas.length
      ? 'Done in ' + (areas.length > 1 ? 'areas ' : 'area ') + listOf(areas.map(a => a.n)) +
        '. The offer line moved down a step to keep clear of it.'
      : 'Headline’s up two steps. The offer line was colliding, so I moved it down.');
    render();
  });
}
/* refusals are ordinary replies, not error states: can't / can / next */
const REFUSALS = [
  [/shah rukh|shahrukh|real person|celebrity|actor |virat|deepika/i,
   "I can't generate real, identifiable people. I can create an original model with the look and styling you want \u2014 festive ethnic wear, similar age and mood. Describe the styling and I'll draft two directions."],
  [/mickey|disney|marvel|pikachu|copyright|trademark|batman/i,
   "I can't use copyrighted characters. I can design an original festive mascot in a similar style and place it beside the lamps. Want me to try that?"],
  [/slimmer|thinner|skinnier|body shape|lighter skin|fairer/i,
   "I can't alter a person's body shape or skin tone. I can change the styling, the pose or the crop instead. Which would help?"],
  [/diagram|flowchart|warehouse|architecture|schematic|spreadsheet/i,
   "I can't build technical diagrams \u2014 I make marketing creative. For a Diwali campaign I can do banners, story formats and RCS cards. Tell me the channel and I'll start."],
  [/qr code|scannable/i,
   "I can't put a scannable QR code into a generated image \u2014 it won't scan reliably. I can leave a clear space for one and you drop it in after export."],
];
const QUOTA = 8;
function refusalFor(t) { const r = REFUSALS.find(x => x[0].test(t)); return r ? r[1] : null; }
function quotaHit() {
  if (S.genCount < QUOTA) return false;
  if (!S.msgs.some(m => m.t === 'banner' && m.quota))
    S.msgs.push({t: 'banner', quota: true, title: 'You\u2019ve used ' + QUOTA + ' of ' + QUOTA + ' image generations this month',
      body: 'Your limit resets on 1 October, or ask your admin to raise it for this workspace. You can still edit, crop and export what you already have.'});
  return true;
}
function doSend() {
  const text = S.draft.trim();
  const live = S.areas.length && !S.sent;
  if (!text && !live) return;
  if (S.busy || S.regen) return;
  S.view = 'chat'; S.stick = true;
  if (live && !text) {                                  // a region with no sentence: aiRA asks
    S.msgs.push({t: 'u', chips: S.areas.slice()});
    S.sent = true; S.draft = '';
    say('Got ' + (S.areas.length > 1 ? 'areas ' : 'area ') + listOf(S.areas.map(a => a.n)) +
      '. What should I do with ' + (S.areas.length > 1 ? 'them' : 'it') + '?');
    render(); return;
  }
  S.msgs.push(live ? {t: 'u', chips: S.areas.slice(), x: text} : {t: 'u', x: text});
  if (live) S.sent = true;
  S.draft = '';
  const no = refusalFor(text);
  if (no) { say(no); render(); return; }            // nothing failed, so nothing is spent and nothing goes red
  if (quotaHit()) { render(); return; }             // the wall — editing and exporting still work
  if (!S.images.length && S.stage !== 'picker') {
    if (hasFormat(text) || S.fmtChoice) { firstGen(pickTplFrom(text)); }
    else { openCard('purpose'); say('I’ve got the brief: Pantaloons, Diwali, flat 50% off, festive. I need to know what it’s for before I generate — the size is baked into the image, so changing it later means generating again.'); render(); }
    return;
  }
  if (S.stage === 'picker') { startRegen(); render(); return; }   // two concepts only on the first attempt
  startEdit(text); render();
}
function pickTplFrom(text) {
  const s = text.toLowerCase();
  const hit = TPLS.find(t => s.includes(t.n.toLowerCase())) || TPLS.find(t => t.sub && s.includes(t.sub.toLowerCase()));
  if (hit) return hit.n;
  if (s.includes('story')) return 'Instagram story';
  if (s.includes('email')) return 'Email banner';
  if (s.includes('banner')) return 'Banner';
  if (s.includes('rcs')) return 'Standard card';
  if (s.includes('whatsapp') || s.includes('square')) return 'Square';
  return 'Instagram post';
}

/* ---------- the one click handler ---------- */
function act(a, el) {
  const d = k => el && el.getAttribute(k);
  if (a !== 'fmt' && a !== 'fmt-set') S.fmtOpen = false;     // any other click closes the dropdown
  switch (a) {
    case 'noop': return;
    case 'send': doSend(); return;
    case 'stop-gen': clearLater(); S.busy = false; S.regen = false; S.rzBusy = false;
      S.msgs = S.msgs.filter(m => m.t !== 'skel');
      toast('Generation stopped — nothing was spent'); break;
    case 'nudge': S.draft = d('data-x'); S.view = S.view === 'home' ? 'home' : 'chat';
      S.focusAfter = '#composer'; break;                     // a nudge fills the composer; it never runs
    case 'to-bottom': S.stick = true; break;
    case 'nav-toggle': { const auto = !!S.stage && window.innerWidth < 1600;
      const now = S.navCollapsed === null ? auto : S.navCollapsed; S.navCollapsed = !now; S.refit = true; break; }
    case 'rail': { const g = d('data-g'); S.railOpen[g] = S.railOpen[g] ? 0 : 1; break; }

    /* clarification card */
    case 'q-purpose': { const k = d('data-k');
      if (k === 'RCS') { openCard('shape', 'RCS', 'RCS card'); break; }
      firstGen(PURPOSE_TPL[k]); return; }
    case 'q-shape': firstGen(d('data-n')); return;
    case 'q-typed': { const v = (S.card.typed || '').trim(); if (!v) { S.focusAfter = 'qtyped'; break; }
      firstGen(pickTplFrom(v)); return; }
    case 'q-skip': say('You didn’t say, so I went with Instagram post — 1080 × 1350 px.');
      firstGen('Instagram post'); return;
    case 'q-min': S.card = null; break;                      // minimised; the question is still open
    case 'q-close': S.card = null; break;                    // Close commits nothing

    /* the picker: clicking a concept IS the commit — there is no confirm step */
    case 'pick-opt': {
      const k = +d('data-i'), c = S.concepts[k] || S.concepts[0];
      const t0 = S.pending || {w: 1080, h: 1350, name: 'Instagram post'};
      const im = mkImage({w: t0.w, h: t0.h, tone: c.tone, ver: 'v1',
        name: 'aira_gen_pantaloons_diwali.png'});
      S.images = [im]; S.active = 0; S.page = 0; S.stage = 'editor'; S.concepts = [];
      S.history = []; S.refit = true;
      S.msgs.push({t: 'card', title: 'Pantaloons Diwali sale creative', ver: 'v1', img: im.id});
      say('Both were ' + t0.w + ' \u00d7 ' + t0.h + ' px for ' + t0.name.toLowerCase() +
        '. The wordmark is AI-rendered \u2014 not your real logo.');
      break; }

    /* strip + panel */
    case 'strip-toggle': S.stripOpen = !S.stripOpen; S.refit = true; break;
    case 'strip-clear': S.gallSel = []; break;
    case 'page-prev': S.page = Math.max(0, S.page - 1); break;
    case 'page-next': S.page = Math.min(Math.ceil(S.images.length / 10) - 1, S.page + 1); break;
    case 'pick': S.active = +d('data-i'); S.page = Math.floor(S.active / 10);
      S.areas = []; S.sent = false; S.tool = null; S.toast = null; S.refit = true; break;
    case 'open-art': { const id = d('data-id');
      let i = S.images.findIndex(x => x.id === id);
      if (i < 0) i = S.images.length - 1;                 // never dead-end: fall back to the latest
      if (i < 0) break;
      S.active = i; S.page = Math.floor(i / 10);
      S.stage = 'editor'; S.panel = null; S.gallery = false; S.refit = true; break; }
    case 'art-close': S.stage = null; S.panel = null; S.tool = null; S.areas = []; S.sent = false;
      clearLater(); S.busy = false; S.regen = false; S.rzBusy = false; S.toast = null; break;
    case 'copy-img': {                         // copy to the clipboard — a tick confirms, then reverts
      S.copied = true; render();
      clearTimeout(S.copyTmr); S.copyTmr = setTimeout(() => { S.copied = false; render(); }, 1500);
      return; }

    /* canvas */
    case 'zoom-in': S.zoomPct = LADDER.find(v => v > S.zoomPct) || 200; break;
    case 'zoom-out': S.zoomPct = LADDER.slice().reverse().find(v => v < S.zoomPct) || 10; break;
    case 'zoom-fit': S.zoomPct = fitPct(); break;
    case 'preview': S.preview = true; break;
    case 'preview-off': S.preview = false; break;
    case 'toast-off': S.toast = null; break;
    case 'resize': S.panel = S.panel === 'resize' ? null : 'resize'; S.tool = null; S.rzFail = false; S.rzNoteX = false; S.refit = true;
      S.areas = []; S.sent = false;                 // resize replaces marking — drop any dragged areas + their chips
      if (S.panel === 'resize') { const im = imgOf(S.active); S.rzPick = null; S.rzLock = false;
        S.crop = {fx: .1, fy: .1, fw: .8, fh: .8}; S.rzW = Math.round(.8 * im.w); S.rzH = Math.round(.8 * im.h); } break;
    case 'rz-note-x': S.rzNoteX = true; break;
    case 'tool-area': S.tool = S.tool === 'area' ? null : 'area'; S.panel = null; break;


    /* export */
    case 'export': S.panel = 'export'; S.tool = null; S.exError = false; S.exPartial = null; S.refit = true;
      S.exList = [S.active]; break;                          // the file bar always means "this image"
    case 'fmt': S.fmtOpen = !S.fmtOpen; break;
    case 'fmt-set': S.fmt = d('data-f'); S.fmtOpen = false; break;
    case 'ex-del': {
      const i = S.images.findIndex(x => x.id === d('data-id'));
      const at = S.exList.indexOf(i);
      S.exList = S.exList.filter(k => k !== i);
      const nxt = S.exList[Math.min(at, S.exList.length - 1)];
      S.focusAfter = S.exList.length ? '#del-' + (S.images[nxt] || {}).id : '[data-act="ex-cancel"]';
      break; }
    case 'ex-cancel': clearLater(); S.panel = null; S.exBusy = false; S.exError = false; S.exPartial = null; S.refit = true; break;
    case 'ex-go': {
      if (S.exBusy || !S.exList.length) break;
      S.exError = false; S.exPartial = null; S.exBusy = true; render();
      const n = S.exList.length, name = S.exName, ext = exExt();
      later('export', 1500, () => {
        S.exBusy = false;
        if (n >= 4 && S.fmt !== 'PDF') {                     // partial is reachable on a real multi-export
          const bad = S.exList.slice(-2).map(i => (S.images[i] || {}).name).filter(Boolean);
          S.exPartial = {ok: n - bad.length, all: n, names: bad.join(' and ')};

      });
      return; }

    /* resize */
    case 'group': { const g = d('data-g'); S.rzOpen[g] = S.rzOpen[g] ? 0 : 1; break; }
    case 'tpl': { const t = TPLS.find(x => x.n === d('data-n'));
      S.rzNoteX = false;                              // a new choice may raise a new note
      if (S.rzPick === t.n) { S.rzPick = null; break; }
      S.rzPick = t.n; S.rzW = t.w; S.rzH = t.h;
      { const im = imgOf(S.active), fracR = (t.w / t.h) * (im.h / im.w);
        let fw0, fh0; if (fracR >= 1) { fw0 = 1; fh0 = 1 / fracR; } else { fh0 = 1; fw0 = fracR; }
        const fw = fw0 * .9, fh = fh0 * .9;         // 90% of the largest fit — leaves margin to drag
        S.crop = {fx: (1 - fw) / 2, fy: (1 - fh) / 2, fw, fh}; }
      break; }
    case 'rz-lock': S.rzLock = !S.rzLock; if (S.rzLock) S.rzLockR = (S.rzW || 1) / (S.rzH || 1); break;
    case 'rz-reset': { const im = imgOf(S.active); S.rzPick = null; S.rzW = im.w; S.rzH = im.h;
      S.crop = {fx: 0, fy: 0, fw: 1, fh: 1}; S.rzSearch = ''; S.rzFail = false; S.rzNoteX = false; break; }
    case 'rz-cancel': clearLater(); S.panel = null; S.rzFail = false; S.rzBusy = false; S.refit = true; break;
    case 'rz-apply': { const t = rzTarget(); if (!rzCheck().crop) break;
      snapshot();
      const src = imgOf(S.active);
      const im = mkImage({w: t.w, h: t.h, tone: src.tone, ver: 'v' + (S.images.length + 1),
        name: 'aira_gen_pantaloons_diwali_' + t.w + 'x' + t.h + '.png'});
      S.images.push(im); S.active = S.images.length - 1; S.page = Math.floor(S.active / 10);
      S.panel = null; S.areas = []; S.refit = true; toast('Cropped to ' + t.w + ' × ' + t.h + ' px as ' + im.ver); break; }
    case 'rz-gen': {
      if (!rzCheck().gen) break;
      if (quotaHit()) { S.panel = null; break; }
      const t = rzTarget(); S.rzFail = false; S.rzBusy = true; render();
      later('rzgen', 1800, () => {
        S.rzBusy = false; S.genCount++;
        if (S.genCount % 5 === 0) { S.rzFail = true; render(); return; }
        snapshot();
        const src = imgOf(S.active);
        const im = mkImage({w: t.w, h: t.h, tone: src.tone, ver: 'v' + (S.images.length + 1),
          name: 'aira_gen_pantaloons_diwali_' + t.w + 'x' + t.h + '.png'});
        S.images.push(im); S.active = S.images.length - 1; S.page = Math.floor(S.active / 10);
        S.panel = null; S.areas = []; S.refit = true;
        S.msgs.push({t: 'card', title: 'Pantaloons Diwali sale creative', ver: im.ver, img: im.id});
        say('Generated at ' + t.w + ' × ' + t.h + ' px' + (t.name ? ' for ' + t.name.toLowerCase() : '') + '. That spent 1 credit.');
        render();
      });
      return; }
    case 'rz-stop': clearLater(); S.rzBusy = false; toast('Generation stopped — nothing was spent'); break;

    /* gallery */
    case 'gallery-open': S.gallery = true; break;
    case 'gall-close': S.gallery = false; S.gallSel = []; break;
    case 'gall-all': S.gallSel = S.gallSel.length === S.images.length ? [] : S.images.map((_, i) => i); break;
    case 'gall-export': S.exList = S.gallSel.slice(); S.gallery = false; S.gallSel = [];
      S.stage = 'editor'; S.panel = 'export'; S.exError = false; S.exPartial = null; S.refit = true; break;
    case 'gall-toggle': { const i = +d('data-i');   // the hover circle: pure select, never opens
      S.gallSel = S.gallSel.includes(i) ? S.gallSel.filter(k => k !== i) : S.gallSel.concat([i]); break; }
    case 'gall-card': { const i = +d('data-i');
      if (S.gallSel.length) { S.gallSel = S.gallSel.includes(i) ? S.gallSel.filter(k => k !== i) : S.gallSel.concat([i]); break; }
      S.active = i; S.page = Math.floor(i / 10); S.gallery = false; S.stage = 'editor';
      S.areas = []; S.sent = false; S.refit = true; break; }

    /* areas */
    case 'area-del': S.areas = S.areas.filter(x => x.n !== +d('data-n')); break;
    case 'retry': S.msgs = S.msgs.filter(m => !(m.t === 'banner' && !m.quota)); startEdit('try again'); break;

}

/* ===================== boot ===================== */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.preview) { S.preview = false; return render(); }
    if (S.gallery) { S.gallery = false; S.gallSel = []; return render(); }
    if (S.busy || S.regen || S.rzBusy) return act('stop-gen');
    if (S.panel) { S.panel = null; return render(); }
    if (S.tool) { S.tool = null; return render(); }
  }
});
let rtm = null;
window.addEventListener('resize', () => {                      // refit on resize, debounced
  clearTimeout(rtm); rtm = setTimeout(() => { if (refit() || S.preview) render(); }, 120);
});
/* Prototype 2 — boots into the editor with a session of images already made.

  ];
})();
