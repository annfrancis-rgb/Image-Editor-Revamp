<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aiRA Image Studio — image browser</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;900&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* ============================================================================
   WALKTHROUGH SHELL TOKENS  (--wt-*)
   Deliberately separate from the app's --aira-* set so a reviewer can always
   tell what is the walkthrough and what is the product.
   ========================================================================= */
:root{
  --wt-canvas:#F6F8FA; --wt-surface:#FFFFFF; --wt-border:#E2E6EB;
  --wt-ink:#111827; --wt-ink-2:#364152; --wt-ink-3:#6B7785;
  --wt-accent:#3438C9; --wt-accent-bg:#EEF0FF;

  /* ==========================================================================
     aiRA DESIGN SYSTEM TOKENS — the app inside the stage uses ONLY these.
     Values from foundations.md. Never a raw hex below this line.
     ======================================================================= */
  --aira-slate-25:#FBFCFD; --aira-slate-50:#F6F8FA; --aira-slate-100:#EEF1F4;
  --aira-slate-200:#E2E6EB; --aira-slate-300:#C9D0D9; --aira-slate-400:#9AA4B2;
  --aira-slate-500:#6B7785; --aira-slate-600:#4D5867; --aira-slate-700:#364152;
  --aira-slate-800:#1F2937; --aira-slate-900:#111827; --aira-slate-950:#0A0F1A;
  --aira-indigo-50:#EEF0FF; --aira-indigo-100:#DDE0FF; --aira-indigo-300:#8E97FF;
  --aira-indigo-400:#6268FF; --aira-indigo-500:#4A50EF; --aira-indigo-600:#3438C9;
  --aira-indigo-700:#252AA0;
  --aira-sky-300:#5EA8FF; --aira-sky-400:#3BA7FF;
  --aira-green-500:#1F7A42; --aira-amber-400:#B97300; --aira-amber-500:#8A5500;
  --aira-red-400:#D92D2D; --aira-text-danger:#D92D2D;

  --aira-bg-default:#FFFFFF; --aira-bg-canvas:var(--aira-slate-50);
  --aira-bg-muted:var(--aira-slate-100); --aira-bg-selected:var(--aira-indigo-50);
  --aira-text-primary:var(--aira-slate-900); --aira-text-secondary:var(--aira-slate-700);
  --aira-text-tertiary:var(--aira-slate-500); --aira-text-link:var(--aira-indigo-600);
  --aira-border-subtle:var(--aira-slate-100); --aira-border-default:var(--aira-slate-200);
  --aira-border-strong:var(--aira-slate-300); --aira-border-brand:var(--aira-indigo-600);
  /* warning / danger surface tints are NOT in foundations.md — flagged in the
     report as needing resolution against tokens.css rather than guessed again */
  --aira-warn-bg:#FFF6E8; --aira-warn-border:#F0D9AE;
  --aira-danger-bg:#FDEDED; --aira-danger-border:#F5C6C6;

  --aira-sp-1:4px; --aira-sp-2:8px; --aira-sp-3:12px; --aira-sp-4:16px;
  --aira-sp-5:20px; --aira-sp-6:24px; --aira-sp-8:32px;
  --aira-radius-xs:4px; --aira-radius-sm:6px; --aira-radius-md:8px;
  --aira-radius-lg:12px; --aira-radius-xl:16px; --aira-radius-pill:999px;
  --aira-shadow-sm:0 1px 2px rgba(17,24,39,.06);
  --aira-shadow-md:0 4px 12px rgba(17,24,39,.08);
  --aira-shadow-lg:0 12px 32px rgba(17,24,39,.12);
  --aira-motion-fast:120ms ease;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--wt-canvas);color:var(--wt-ink);
  font-family:Roboto,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:20px;
  -webkit-font-smoothing:antialiased;overflow-x:auto;overflow-y:hidden}

/* ---------- shell layout ---------- */
.wt{height:100vh;min-width:1280px;display:flex;flex-direction:column}
.wbody{flex:1;display:flex;min-height:0}
.rail{width:256px;flex-shrink:0;overflow-y:auto;padding:16px 0 28px;
  background:var(--wt-surface);border-right:1px solid var(--wt-border)}
.stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;
  overflow:hidden;padding:16px}
.insp{width:200px;flex-shrink:0;overflow-y:auto;padding:16px;
  background:var(--wt-surface);border-left:1px solid var(--wt-border)}

/* ---------- top bar ---------- */
.wtop{height:64px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 24px;
  background:var(--wt-surface);border-bottom:1px solid var(--wt-border)}
.wtop .wname{font-size:16px;line-height:24px;font-weight:500}
.wtop .sep{flex:1}
.sid{font-size:11px;line-height:16px;font-weight:700;letter-spacing:.06em;
  color:var(--wt-accent);background:var(--wt-accent-bg);border-radius:4px;padding:2px 8px}
.wtop .sname{font-size:14px;line-height:20px;color:var(--wt-ink-2)}
.wbtn{display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:8px;
  border:1px solid var(--wt-border);background:var(--wt-surface);font-family:inherit;
  font-size:14px;line-height:20px;color:var(--wt-ink-2);cursor:pointer}
.wbtn:hover{background:var(--wt-accent-bg)}
.wbtn.on{background:var(--wt-accent-bg);border-color:var(--wt-accent);color:var(--wt-accent)}
.wbtn[disabled]{opacity:.45;cursor:not-allowed}
.wbtn:focus-visible,.rrow:focus-visible,.trow:focus-visible{outline:2px solid var(--wt-accent);outline-offset:2px}

/* ---------- rail ---------- */
.rsec{padding:0 0 18px}
.rsec .rh{padding:0 16px;margin-bottom:8px;display:flex;flex-direction:column;gap:4px}
.rsec .rt{font-size:11px;line-height:16px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--wt-ink-3)}
.rsec .rd{font-size:12px;line-height:17px;color:var(--wt-ink-3)}
.rrow{display:flex;align-items:flex-start;gap:10px;width:100%;padding:6px 16px;border:0;
  background:none;text-align:left;font-family:inherit;cursor:pointer}
.rrow:hover{background:var(--wt-accent-bg)}
.rrow .ri{width:26px;flex-shrink:0;font-size:12px;line-height:18px;color:var(--wt-ink-3)}
.rrow .rn{font-size:13px;line-height:18px;color:var(--wt-ink)}
.rrow.on{background:var(--wt-accent-bg)}
.rrow.on .ri,.rrow.on .rn{color:var(--wt-accent);font-weight:500}
.rrow.ref .rn{color:var(--wt-ink-3);font-style:italic}

/* ---------- stage ---------- */
.holder{position:relative}
.frame{transform-origin:top left;border-radius:12px;overflow:hidden;
  border:1px solid var(--wt-border);background:#fff;
  box-shadow:0 18px 44px rgba(17,24,39,.10),0 3px 10px rgba(17,24,39,.05)}

/* ---------- inspector ---------- */
.iblk{margin-bottom:18px}
.ih{font-size:10px;line-height:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--wt-ink-3);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.hchip{font-size:10px;line-height:15px;font-weight:700;letter-spacing:.04em;
  color:var(--wt-accent);background:var(--wt-accent-bg);border-radius:4px;padding:2px 6px}
.hchip.now{background:var(--wt-accent);color:#fff}
.trow{display:flex;align-items:flex-start;gap:8px;width:100%;margin-bottom:6px;padding:8px 10px;
  border:1px solid var(--wt-border);border-radius:10px;background:var(--wt-surface);
  text-align:left;font-family:inherit;cursor:pointer}
.trow:hover{background:var(--wt-accent-bg)}
.trow .tl{flex:1;min-width:0;font-size:12px;line-height:17px;color:var(--wt-ink)}
.trow .tt{flex:none;font-size:10px;line-height:17px;font-weight:700;letter-spacing:.04em;color:var(--wt-ink-3)}
.note{font-size:12px;line-height:18px;color:var(--wt-ink-2)}
.note b{font-weight:500;color:var(--wt-ink)}
.helpcard{border:1px solid var(--wt-border);border-radius:10px;padding:10px;
  font-size:11.5px;line-height:17px;color:var(--wt-ink-2)}
.helpcard b{font-weight:500;color:var(--wt-ink)}
.divg{border:1px solid var(--aira-warn-border);background:var(--aira-warn-bg);border-radius:8px;
  padding:9px;font-size:11px;line-height:16px;color:var(--wt-ink-2);margin-top:8px}
.divg b{color:var(--aira-amber-500)}

/* click-targets overlay: one rule, driven by the data-live attribute */
body.targets [data-live]{outline:2px dashed var(--wt-accent);outline-offset:2px}
</style>
<style>
/* ============================================================================
   THE APP INSIDE THE STAGE. aiRA tokens only — no raw hex past this point,
   except the SVG artwork, which is generated-image content, not UI.
   ========================================================================= */
.app{width:1440px;height:900px;display:flex;overflow:hidden;position:relative;
  font-family:Roboto,-apple-system,"Segoe UI",sans-serif}
.plate{display:flex;align-items:center;justify-content:center;overflow:hidden}

/* ---- Capillary host nav. Deliberately NOT aiRA-tokened: it is the host
        product's chrome, which the design system expects aiRA to sit beside. */
.capnav{width:64px;flex:none;height:100%;background:#171923;display:flex;flex-direction:column;
  align-items:center;padding:12px 0;gap:2px;overflow:hidden}
.capitem{width:48px;height:48px;flex:none;border-radius:var(--aira-radius-md);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#8B92A6}
.capitem.on{background:rgba(255,255,255,.06);color:var(--aira-sky-300)}
.capitem span{font-size:9px;line-height:1;text-align:center;letter-spacing:.01em}

.uicol{flex:1;min-width:0;height:100%;background:var(--aira-bg-canvas);display:flex;
  flex-direction:column;overflow:hidden;position:relative}
.topbar{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 20px;
  background:var(--aira-bg-default);border-bottom:1px solid var(--aira-border-default)}
.topbar .wm{font-size:16px;line-height:24px;font-weight:600;color:var(--aira-text-primary)}
.orgpill{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;
  border-radius:var(--aira-radius-md);border:1px solid var(--aira-border-default);
  background:var(--aira-bg-default);color:var(--aira-text-secondary);font-size:13px;font-weight:500}
.mainrow{flex:1;min-height:0;display:flex}

/* ---- chat ---- */
.chat{flex:none;background:var(--aira-bg-canvas);border-right:1px solid var(--aira-border-default);
  display:flex;flex-direction:column;overflow:hidden}
.chat-t{padding:16px 16px 8px;font-size:16px;line-height:24px;font-weight:600;color:var(--aira-text-primary)}
.msgs{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px}
.m-user{align-self:flex-end;max-width:82%;background:var(--aira-bg-muted);
  border-radius:var(--aira-radius-lg);padding:10px 14px;font-size:14px;line-height:22px;
  color:var(--aira-text-primary)}
.m-ai{font-size:14px;line-height:22px;color:var(--aira-text-primary)}
.m-ai .lead{margin-bottom:6px}
.m-ai .li{margin:4px 0}
.m-ai .li b{font-weight:500}
.m-step{font-family:"Roboto Mono",monospace;font-size:12px;line-height:18px;
  background:var(--aira-bg-muted);border-radius:var(--aira-radius-sm);padding:7px 10px;
  color:var(--aira-text-secondary);align-self:flex-start;max-width:100%;word-break:break-all}
.m-act{display:flex;align-items:center;gap:8px;font-size:13px;line-height:20px;
  color:var(--aira-text-tertiary)}
/* The artifact card, matched to the live product: full width of the message
   column, indigo-400 hairline on indigo-50, the artifact's own title in
   primary text, and the version as quiet subtext underneath — not a pill on
   the right. It is ONE component: a generated image and a promotion config are
   both artifacts and both land in the thread this way. It replaces the
   "Generated 2 concepts" activity lines, which described the mechanism instead
   of giving the user the thing that was made. */
.m-art{border:1.5px solid var(--aira-indigo-400);background:var(--aira-indigo-50);
  border-radius:var(--aira-radius-md);padding:14px 16px;cursor:pointer}
.m-art .t{font-size:15px;line-height:22px;font-weight:600;color:var(--aira-text-primary)}
.m-art .v{margin-top:2px;font-size:12px;line-height:18px;color:var(--aira-text-tertiary)}
/* Arriving at a turn from a thumbnail click, the artifact card is the thing you
   came for, so it carries a ring on top of the turn's rail. The rail still
   covers the whole turn, because the request that produced the image is the
   context that makes the card mean anything. */
.jump .m-art{box-shadow:0 0 0 3px var(--aira-indigo-100)}
/* SHELL chrome, not product: this file carries one section, so a live control
   that leads into another one has nowhere to go. Saying so is better than the
   silent no-op a missing step would otherwise produce — a dead button reads as
   a broken prototype. Built from --wt-* tokens so it can never be mistaken for
   something aiRA would draw. */
.wtnote{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;
  background:var(--wt-ink);color:#fff;font-size:12.5px;line-height:18px;
  padding:9px 14px;border-radius:8px;box-shadow:0 8px 24px rgba(15,17,25,.28);
  opacity:0;pointer-events:none;transition:opacity .15s}
.wtnote.on{opacity:1}
.jump{position:relative;padding-left:11px}
.jump::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:2px;
  background:var(--aira-indigo-600)}
.alert{border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.alert.danger{border:1px solid var(--aira-danger-border);background:var(--aira-danger-bg)}
.alert.warning{border:1px solid var(--aira-warn-border);background:var(--aira-warn-bg)}
.alert .at{font-size:13.5px;line-height:20px;font-weight:500;color:var(--aira-text-primary)}
.alert .ab{margin-top:2px;font-size:13px;line-height:19px;color:var(--aira-text-secondary)}

/* ---- composer ---- */
.comp{border:1px solid var(--aira-border-default);border-radius:14px;
  background:var(--aira-bg-default);display:flex;flex-direction:column}
.comp.focused{border-color:var(--aira-indigo-600)}
.comp.locked{opacity:.65}
.comp-row{display:flex;align-items:center;gap:6px;padding:6px 8px}
.comp-ico{width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:none}
.comp-txt{flex:1;padding:6px 0;font-size:14px;line-height:22px;color:var(--aira-text-primary)}
.comp-txt.ph{color:var(--aira-text-tertiary)}
.caret{display:inline-block;width:1px;height:16px;background:var(--aira-text-primary);
  vertical-align:-3px;margin-left:1px;animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.send{width:30px;height:30px;border-radius:var(--aira-radius-pill);display:flex;align-items:center;
  justify-content:center;flex:none;background:var(--aira-bg-muted)}
.send.ready{background:var(--aira-indigo-600)}
.attach-chip{margin:10px 10px 0;display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--aira-border-default);border-radius:var(--aira-radius-md);
  padding:6px 10px 6px 6px;background:var(--aira-bg-default);align-self:flex-start}
.attach-chip .thumb{width:28px;height:28px;border-radius:var(--aira-radius-sm);overflow:hidden;flex:none}
.attach-chip .nm{font-size:12px;line-height:16px;color:var(--aira-text-secondary);max-width:180px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- artifact header + strip ---- */
.arthdr{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 20px;border-bottom:1px solid var(--aira-border-default);background:var(--aira-bg-default)}
.arthdr .fn{min-width:0;font-size:14px;line-height:20px;font-weight:600;color:var(--aira-text-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hicons{flex:none;display:flex;align-items:center;gap:2px}
.hicon{width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.hdiv{width:1px;height:20px;background:var(--aira-border-default);margin:0 6px}
/* Expanded height is fixed at 80px so that switching between thumbnails, or
   the View-all tile appearing, never nudges the canvas below it. Hiding the
   images is the one case that DOES change the height, and it has to: a hide
   control that leaves an 80px empty band behind has not hidden anything. So
   collapsed is a genuine 40px bar and the canvas gets the other 40px back —
   the centred artwork rises 20px, which is the point of asking for the room. */
.striprow{flex:none;height:80px;display:flex;align-items:center;gap:6px;padding:8px 20px;
  border-bottom:1px solid var(--aira-border-default);background:var(--aira-bg-default)}
.striprow.slim{height:40px;padding:0 20px}
/* A real horizontal scroller, not chevron-paged windowing. The trailing item
   clips at the edge rather than the row padding to fit, which is what signals
   there is more; the scrollbar is the thumb alone on a transparent track. */
.thumbs{flex:1;min-width:0;display:flex;align-items:flex-start;gap:6px;
  overflow-x:auto;overflow-y:hidden;padding-bottom:6px}
.thumbs > *{flex:none}
.thumbs::-webkit-scrollbar{height:6px}
.thumbs::-webkit-scrollbar-track{background:transparent}
.thumbs::-webkit-scrollbar-thumb{background:var(--aira-slate-300);border-radius:3px}
.thumbs::-webkit-scrollbar-thumb:hover{background:var(--aira-slate-400)}
.thumbs{scrollbar-width:thin;scrollbar-color:var(--aira-slate-300) transparent}
.thumb52{width:52px;height:52px;flex:none;border-radius:var(--aira-radius-sm);overflow:hidden;
  border:2px solid transparent;cursor:pointer}
.thumb52.on{border-color:var(--aira-indigo-600)}
.chev{width:26px;height:26px;flex:none;border-radius:var(--aira-radius-sm);display:flex;
  align-items:center;justify-content:center;cursor:pointer}
.chev.off{cursor:default}
/* Same 52px square as every other thumbnail, so the row stays one continuous
   strip rather than a strip with a button stuck on the end. It also absorbs the
   right chevron's job — paging forward and revealing the rest are the same
   gesture at that point, so there is no reason to draw two controls. */
.viewall{width:52px;height:52px;flex:none;border-radius:var(--aira-radius-sm);
  border:1px solid var(--aira-border-strong);background:var(--aira-bg-default);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer}
.viewall:hover{background:var(--aira-bg-selected);border-color:var(--aira-indigo-300)}
.viewall .vn{font-size:11px;font-weight:600;line-height:14px;color:var(--aira-text-link)}
.viewall .vl{font-size:9px;line-height:11px;color:var(--aira-text-tertiary)}
/* Show and hide live in the SAME place at the leading edge, so the control does
   not jump from one end of the row to the other between the two states.
   The LABEL comes first and the chevron follows it: the label and the filename
   in the row below are both text at the start of their row, so they share the
   20px page edge. Leading with the chevron indented the label 32px and left the
   two rows visibly out of line. Width is fixed so the thumbnails start at the
   same place whichever label is showing. */
.striptoggle{flex:none;display:flex;align-items:center;gap:4px;width:120px;cursor:pointer}
.striptoggle span{font-size:12px;line-height:18px;color:var(--aira-text-secondary);
  white-space:nowrap}
.stripcollapsed{flex:none;display:flex;align-items:center;gap:8px;padding:7px 20px;
  border-bottom:1px solid var(--aira-border-default);background:var(--aira-bg-default);cursor:pointer}
.stripcollapsed span{font-size:12px;line-height:18px;color:var(--aira-text-secondary)}

/* ---- canvas stage ---- */
.canvaswrap{flex:1;min-height:0;display:flex;background:var(--aira-slate-25);position:relative}
.canvascol{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--aira-slate-25);
  position:relative}
.ctxbar{flex:none;display:flex;align-items:center;gap:12px;padding:12px 20px;
  border-bottom:1px solid var(--aira-border-default);background:var(--aira-bg-default);
  font-size:13px;color:var(--aira-text-secondary)}
/* The toolbar used to be a flex sibling of the image, so it hugged the image
   and was pushed off the bottom as soon as you zoomed in — the control you need
   in order to zoom back out was the first thing to leave the screen. It is now
   docked to the canvas: the image scrolls under it, the toolbar does not move.
   The canvas scrolls rather than clipping, so a zoomed image can be panned. */
/* The SCROLLER is .fscroll, not .framewrap, so the docked toolbar sits outside
   the scrolling content and cannot scroll away when a zoomed image is panned. */
.framewrap{flex:1;min-height:0;position:relative;overflow:hidden}
/* margin:auto on the child, NOT justify-content:center. With justify-content a
   flex child wider than its container overflows BOTH edges and the left half
   becomes unreachable — the scrollbar cannot get to it. margin:auto centres
   while small and scrolls correctly once oversized. */
.fscroll{position:absolute;inset:0;overflow:auto;display:flex;padding:24px 24px 88px}
.fscroll > *{margin:auto;flex:none}
.fscroll::-webkit-scrollbar{width:10px;height:10px}
.fscroll::-webkit-scrollbar-track{background:transparent}
.fscroll::-webkit-scrollbar-thumb{background:var(--aira-slate-300);
  border-radius:var(--aira-radius-sm);border:3px solid transparent;background-clip:content-box}
.fscroll::-webkit-scrollbar-thumb:hover{background:var(--aira-slate-400);background-clip:content-box}
.fscroll::-webkit-scrollbar-corner{background:transparent}
.fscroll{scrollbar-width:thin;scrollbar-color:var(--aira-slate-300) transparent}
.tbardock{position:absolute;left:0;right:0;bottom:24px;display:flex;flex-direction:column;
  align-items:center;gap:12px;pointer-events:none;z-index:6}
.tbardock > *{pointer-events:auto}
.imgbox{position:relative;overflow:hidden}
.imgbox.r8{border-radius:var(--aira-radius-md)}
.imgbox.sh{box-shadow:0 16px 40px rgba(17,24,39,.16)}
.imgbox.dim{filter:brightness(.72) saturate(.85)}
.emptybox{display:flex;align-items:center;justify-content:center;border-radius:var(--aira-radius-md)}

/* ---- generated artwork -------------------------------------------------

   raw colour rather than aiRA tokens. Every call gets a unique gradient id —

var PAL = {

  for(var i=0;i<7;i++){

    s += '<circle cx="'+Math.round(w*(0.08+i*0.14))+'" cy="'+Math.round(h*0.94)+'" r="'+Math.max(2,Math.round(w*0.012))+'" fill="'+p[2]+'" opacity=".8"/>';

var CHANNEL_GROUPS = [
  { name:"Messaging channels", subgroups:[
    { label:"RCS", items:[

  var out=[]; CHANNEL_GROUPS.forEach(function(g){

}

/* validateSize — both limits, and it reports WHICH one bit. Composes multiple
   violations, because a value can break the pixel bounds and the ratio at once. */
function validateSize(w,h,target){
  var lo=Math.min(w,h), hi=Math.max(w,h), ratio=hi/lo, hits=[];
  if(lo<100 || hi>3840) hits.push("the 100–3840px limits");
  if(target && target.maxRatio && ratio>target.maxRatio)
    hits.push(target.channel+"’s max "+target.maxRatio+":1");
  else if(ratio>3.0000001) hits.push("the max 3:1 limit");
  if(!hits.length) return { ok:true, message:"", notice:"" };
  /* two phrasings of the same fact. `message` is the past-tense toast the
     canvas specified; `notice` is what the pinned block says, and it states
     the rule rather than claiming an adjustment that has not happened yet. */
  return { ok:false, message:"Adjusted to "+hits.join(", "),
           notice:"This size is outside "+hits.join(" and ")+"." };
}

<script>
"use strict";
/* ===========================================================================

var SESSION = { stripCollapsed:false, exportFormat:0 };   // survives reset()

function defaults(){

    strip:{ visible:false, collapsed:false, items:[], activeIndex:0, showAll:false, scrollLeft:0 },

             dim:false, emptyIcon:null, label:true },
    crop:{ on:false, rect:[0,0,1,1] },
    toolbar:{ visible:false, activeTool:null, canUndo:true, canRedo:true, fullscreenActive:false },
    toast:{ text:"" },
    dropdown:{ open:false, selected:SESSION.exportFormat },
    picker:{ visible:false, mode:"none", pickedIndex:null, cards:[], cardW:260,
             heading:"Pick the one that you like", buttons:true },
    resize:{ open:false, scrollTop:0, focusField:null, caret:null, lastAction:"drag", ratioActive:"Freeform", selectedId:null, linkRatio:false,
             searchQuery:"", widthVal:1080, heightVal:1080, resetEnabled:false,
             cropImpossible:false, primaryDisabled:false, footerLabel:"Apply crop",
             generateOffer:null, refusal:null, banner:null, generating:false,
             expandAll:false, autoHeight:false, scrollThumb:true, openGroups:["Messaging channels"] },
    fullscreen:{ open:false }, gallery:{ open:false },
    home:false, reference:false
  };
}
var S = defaults();
function reset(){
  var d = defaults();
  Object.keys(d).forEach(function(k){ S[k] = d[k]; });
  /* The strip's collapsed state genuinely persists for a session in the real
     product, and it still does here while you click around inside the app.
     But reset() must NOT read it back: a session flag that survives reset
     means visiting F8 silently re-renders 25 other steps with a collapsed
     strip, which is exactly the "step inherits state from wherever you came
     from" failure. Each step declares its own; F8 is the one that collapses. */

}

/* ---- derived — computed, never stored ---------------------------------- */
function fit(){
  var n = Math.max(S.canvas.nativeW, S.canvas.nativeH);
  var sc = Math.min(1, 420/n);
  if(S.canvas.boxOverride) {
    var bw=S.canvas.boxOverride[0], bh=S.canvas.boxOverride[1];
    return { w:bw, h:bh, scale:bw/S.canvas.nativeW };
  }

function filteredIds(){

  if(!q) return null;

    return (t.label+" "+(t.dims||"")).toLowerCase().indexOf(q) >= 0;
  }).map(function(t){ return t.id; });
}
/* thumbnail overflow — a real 956px budget, not a fixed cap.
   1440 nav(64) chat(380) padding(40) = 956. */
/* The row scrolls now, so the budget no longer decides how many thumbnails
   RENDER — every capped item does. It is only used to work out whether the row

   them one screen at a time is not browsing, it is scrubbing. The tile is
   pinned to the trailing edge rather than buried at position 20, so it is

var STRIP_CAP = 20;
function stripView(){
  var n = S.strip.items.length;

<script>

  var f = fit(), m = S.canvas.mode, inner = "";
  if(m==="skeleton"){
    inner = '<div class="imgbox r8" style="width:'+f.w+'px;height:'+f.h+'px">'+
            '<div class="skel" style="width:100%;height:100%"></div></div>';
  } else if(m==="emptySolid" || m==="emptyDashed"){
    inner = '<div class="emptybox '+(m==="emptySolid"?"solid":"dashed")+'" style="width:'+f.w+'px;height:'+f.h+'px">'+
            ic(S.canvas.emptyIcon||"alert",32,"var(--aira-slate-400)")+'</div>';
  } else if(m==="image"){
    var scrim = "", frame = "";
    if(S.crop.on){
      var r=S.crop.rect, x=r[0]*f.w, y=r[1]*f.h, cw=r[2]*f.w, ch=r[3]*f.h;
      var geo = 'left:'+x+'px;top:'+y+'px;width:'+cw+'px;height:'+ch+'px';
      scrim = '<div class="cropscrim" style="'+geo+'"></div>';
      frame = '<div class="cropbox" id="cropbox" style="'+geo+'">'+
        [["nw",-7,-7],["ne",null,-7],["sw",-7,null],["se",null,null]].map(function(hh){
          var pos = (hh[1]===null?'right:-7px':'left:'+hh[1]+'px')+';'+
                    (hh[2]===null?'bottom:-7px':'top:'+hh[2]+'px');
          return '<div class="crophandle '+hh[0]+'" data-h="'+hh[0]+'" data-live="Crop handle" style="'+pos+'"></div>';
        }).join("")+'</div>';
    }
    inner = '<div class="imgwrap" style="width:'+f.w+'px;height:'+f.h+'px">'+
            '<div class="imgbox r8 sh'+(S.canvas.dim?" dim":"")+'" id="imgbox" style="width:'+f.w+'px;height:'+f.h+'px">'+
            creative(f.w,f.h,S.canvas.variant,S.canvas.label)+scrim+'</div>'+frame+'</div>';
  }
  var tb = (S.toolbar.visible && m!=="skeleton") ? toolbarHtml() : "";
  var toast = S.toast.text ? '<div class="toastpill">'+esc(S.toast.text)+'</div>' : "";
  var dock = (tb||toast) ? '<div class="tbardock">'+tb+toast+'</div>' : "";
  return '<div class="framewrap"><div class="fscroll">'+inner+'</div>'+dock+'</div>';
}
function toolbarHtml(){
  var t=S.toolbar;
  var b = function(name,dis,act,label){
    return '<div class="tbtn'+(dis?" dis":"")+'" '+(dis?"":'data-live="'+label+'" data-act="'+act+'"')+'>'+
      ic(name,17, dis?"var(--aira-slate-300)":"var(--aira-slate-700)")+'</div>'; };
  return '<div class="tbar"><div class="tgrp">'+
    b("minus",false,"zoomOut","Zoom out")+
    '<span class="zoomv">'+zoomLabel()+'</span>'+
    b("plus",false,"zoomIn","Zoom in")+b("fit",false,"zoomFit","Fit")+
    '<div class="tbtn'+(t.fullscreenActive?" on":"")+'" data-live="Full screen" data-act="fullscreen">'+
      ic("expand",17, t.fullscreenActive?"var(--aira-indigo-600)":"var(--aira-slate-700)")+'</div>'+
    '</div><div class="tdiv"></div>'+
    '<div class="toolbtn'+(t.activeTool==="resize"?" on":"")+'" data-live="Resize" data-act="resize">'+
      ic("frame",17, t.activeTool==="resize"?"var(--aira-indigo-600)":"var(--aira-slate-700)")+'Resize</div>'+
    '<div class="tdiv"></div><div class="tgrp">'+
    b("undo",!t.canUndo,"undo","Undo")+b("redo",!t.canRedo,"redo","Redo")+'</div></div>';
}

/* ---- resize drawer ------------------------------------------------------ */
function swatch(w,h,on){
  var box=24, r=w/h, sw = r>=1?box:Math.round(box*r), sh = r>=1?Math.round(box/r):box;
  return '<div class="swatchbox"><div class="swatch" style="width:'+sw+'px;height:'+sh+'px"></div></div>';
}
function targetRow(t, on, sub){
  return '<div class="trow2'+(on?" on":"")+'" data-live="'+esc(t.label)+'" data-act="pickTarget" data-id="'+esc(t.id)+'">'+
    swatch(t.w,t.h,on)+'<div class="tmeta"><div class="tl2">'+esc(t.label)+'</div>'+
    '<div class="ts2">'+esc(sub||t.dims||t.sub||"")+'</div></div><div class="radio"></div></div>';
}
function drawer(){
  if(!S.resize.open) return "";
  var R=S.resize, fids=filteredIds(), ar=activeRow();
  var noRes = fids && fids.length===0;

  var search = '<div class="dsearch"><div class="si">'+ic("search",15, R.searchQuery?"var(--aira-slate-500)":"var(--aira-slate-400)")+'</div>'+
    '<input class="sf'+(R.searchQuery?" typed":"")+'" data-live="Search" data-field="search" '+
      'placeholder="Search for templates" value="'+esc(R.searchQuery)+'">'+
    (R.searchQuery ? '<button class="clearx" type="button" data-live="Clear search" data-act="clearSearch" aria-label="Clear search">'+
       ic("x",13,"var(--aira-slate-600)")+'</button>' : '')+
    '</div>';

  var exactBlock = '<div class="exact"><div class="lbl">Enter exact size</div><div class="dims">'+
    '<div class="dimf"><label for="dw">Width</label><div class="dimv'+(exactActive()?" act":"")+'">'+
      '<input id="dw" data-live="Width" data-field="w" inputmode="numeric" value="'+R.widthVal+'"><span class="u">px</span></div></div>'+
    '<button class="linkb'+(R.linkRatio?" on":"")+'" type="button" data-live="Lock ratio" data-act="lockRatio" aria-pressed="'+(R.linkRatio?"true":"false")+'">'+ic("link",16,R.linkRatio?"var(--aira-indigo-600)":"var(--aira-slate-500)")+'</button>'+
    '<div class="dimf"><label for="dh">Height</label><div class="dimv'+(exactActive()?" act":"")+'">'+
      '<input id="dh" data-live="Height" data-field="h" inputmode="numeric" value="'+R.heightVal+'"><span class="u">px</span></div></div>'+
    '</div></div>';

  var freeRow = fids ? "" : targetRow(FREEFORM, ar==="Freeform", FREEFORM.sub);

  var list = CHANNEL_GROUPS.map(function(g){
    var items = g.items || g.subgroups.reduce(function(a,s){return a.concat(s.items);},[]);
    var keep = items.filter(function(i){ return !fids || fids.indexOf(i.id)>=0; });
    if(!keep.length) return "";
    var holds = keep.some(function(i){ return i.id===ar; });
    /* Messaging channels used to be force-open by name, so the chevron could
       never close it. It is open by DEFAULT (seeded into openGroups) but the
       user's own toggle now wins. Search still forces groups open, because a
       filtered list you have to expand is a search that does not search. */
    var open = R.expandAll || !!fids || R.openGroups.indexOf(g.name)>=0;
    var body = g.items
      ? g.items.filter(function(i){return !fids||fids.indexOf(i.id)>=0;})
          .map(function(i){ return targetRow(i, i.id===ar); }).join("")
      : g.subgroups.map(function(sg){
          var rows = sg.items.filter(function(i){return !fids||fids.indexOf(i.id)>=0;});
          if(!rows.length) return "";
          return '<div class="subl">'+esc(sg.label)+'</div>'+
                 rows.map(function(i){ return targetRow(i, i.id===ar); }).join("");
        }).join("");
    return '<div class="grp"><button class="grph" type="button" data-live="'+esc(g.name)+'" data-act="toggleGroup" data-g="'+esc(g.name)+'">'+
      '<span>'+esc(g.name)+'</span>'+
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="transform:rotate('+(open?0:-90)+'deg);transition:transform var(--aira-motion-fast)"><path d="M6 9l6 6 6-6" stroke="var(--aira-slate-500)" stroke-width="1.8" stroke-linecap="round"/></svg></button>'+
      '<div style="display:'+(open?"block":"none")+'">'+body+'</div></div>';
  }).join("");

  var refusal = R.refusal ? '<div class="alert warning">'+
    ic("alert",17,"var(--aira-amber-500)")+'<div><div class="at">'+esc(R.refusal.title)+'</div>'+
    '<div class="ab">'+esc(R.refusal.body)+'</div>'+
    (R.refusal.cta?'<div style="margin-top:10px"><button class="btn sec" style="width:auto;display:inline-block" data-live="'+esc(R.refusal.cta)+'" data-act="switchGenerate">'+esc(R.refusal.cta)+'</button></div>':'')+
    '</div></div>' : "";
  var banner = R.banner ? '<div class="alert danger">'+
    ic("alert",18,"var(--aira-text-danger)")+'<div><div class="at">'+esc(R.banner.title)+'</div>'+
    '<div class="ab">'+esc(R.banner.body)+'</div></div></div>' : "";
  /* Derived, never stored: any step whose size breaks a limit gets this line
     without having to remember to set it. It replaced a toast — a transient
     message for a condition that persists until the number changes is the same
     "the reason is not where the action is" failure, just on a timer. */
  var lim = "";
  if(!R.generating && !R.refusal && R.widthVal>0 && R.heightVal>0){
    var v = validateSize(R.widthVal, R.heightVal, targetById(R.selectedId));
    if(!v.ok) lim = '<div class="alert warning">'+ic("alert",17,"var(--aira-amber-500)")+
      '<div><div class="ab">'+esc(v.notice)+'</div></div></div>';
  }
  var notice = (banner||refusal||lim)
    ? '<div class="dnotice">'+banner+refusal+lim+'</div>' : "";

  /* Search sits OUTSIDE the scrolling body. Making it position:sticky would
     also work, but then it depends on a background that has to cover whatever
     scrolls under it — pulling it out of the scroller means it simply cannot
     move, whatever the list below is doing. */
  var body;
  if(R.generating){
    body = '<div class="dact"><span class="spin"></span><span style="font-size:13px;color:var(--aira-text-secondary)">Generating the resized version</span></div>'+
           '<div class="dpad" style="opacity:.45">'+list+'</div>';
  } else if(noRes){
    body = '<div class="nores"><div style="display:flex;justify-content:center;margin-bottom:10px">'+
      ic("search",22,"var(--aira-slate-300)")+'</div>'+
      '<div class="h">No templates match “'+esc(R.searchQuery)+'”</div>'+
      '<div class="s">Try a channel name like WhatsApp or RCS, or enter an exact size below.</div></div>'+
      '<div class="dpad">'+exactBlock+'</div>';
  } else {
    body = '<div class="dpad">'+exactBlock+freeRow+list+'</div>';
  }

  var genPri = generateIsPrimary(), cropInert = R.primaryDisabled || R.cropImpossible;
  var primary;
  if(R.generating) primary = '<button class="btn stop" data-live="Stop" data-act="stop">'+ic("stop",15,"var(--aira-slate-700)")+'Stop</button>';
  else if(cropInert) primary = '<div class="btn inert">'+esc(R.footerLabel)+'</div>';
  else if(genPri) primary = '<button class="btn ghost" style="gap:0" data-live="'+esc(R.footerLabel)+'" data-act="applyCrop">'+esc(R.footerLabel)+'</button>';
  else primary = '<button class="btn pri" data-live="'+esc(R.footerLabel)+'" data-act="applyCrop">'+esc(R.footerLabel)+'</button>';

  /* While the generation runs, the button that started it must not still look
     like a live primary — it reads as pressed and inert, because pressing it
     again is not a thing you can do. Stop is the live control at that moment. */
  var gen = R.generateOffer ? '<div style="margin-top:8px">'+
    (R.generating
      ? '<div class="btn pressed">'+esc(R.generateOffer.label)+'</div>'
      : genPri
        ? '<button class="btn pri" data-live="'+esc(R.generateOffer.label)+'" data-act="generate">'+esc(R.generateOffer.label)+'</button>'
        : '<button class="btn ghost" data-live="'+esc(R.generateOffer.label)+'" data-act="generate">'+ic("refresh",15,"var(--aira-slate-600)")+esc(R.generateOffer.label)+'</button>')+
    '</div>' : "";

  return '<aside class="drawer'+(R.autoHeight?" auto":"")+'">'+
    '<div class="dhead"><h3>Resize</h3><span class="dreset'+(R.resetEnabled?" on":"")+'" '+
      (R.resetEnabled?'data-live="Reset" data-act="resetDrawer"':'')+'>Reset</span></div>'+
    (R.generating ? '' : search)+
    '<div class="dbody'+(R.autoHeight?" auto":"")+'">'+body+
    '</div>'+notice+
    '<div class="dfoot"><div class="frow">'+
      '<div style="flex:none;width:84px"><button class="btn sec" data-live="Cancel" data-act="cancelDrawer">Cancel</button></div>'+
      '<div style="flex:1">'+primary+'</div></div>'+gen+'</div></aside>';
}
</script>
<script>
"use strict";
function pickerArea(){
  var P=S.picker;
  /* Derived from the count. It said "two options" over a grid of four, because
     the copy was a stored string rather than a function of what is on screen. */
  var nCards = P.cards.length;
  /* No subheading on the picker. "Pick the one that you like" already says what
     to do, and the count is visible in the grid — a line restating both was
     telling the user what they can see. The regenerating state keeps its line
     because there IS something to say there: nothing is actionable yet. */
  var head = P.mode==="regen"
    ? { h:"Regenerating "+nCards+" new concepts…", s:"Hang tight — this only takes a moment." }
    : { h:P.heading, s:null };
  P.cardW = P.cards.length<=2 ? 260 : (P.cards.length===3 ? 230 : 190);
  var cards = P.cards.map(function(c,i){
    var on = P.mode==="picked" && i===P.pickedIndex;
    var art = P.mode==="regen"
      ? '<div class="skel" style="width:'+P.cardW+'px;height:'+P.cardW+'px"></div>'
      : creative(P.cardW,P.cardW,c.variant,true);
    return '<div class="pcard'+(on?" on":"")+'" style="width:'+P.cardW+'px" '+
      (P.mode==="regen"?'':'data-live="'+esc(c.label)+'" data-act="pickCard" data-i="'+i+'"')+'>'+
      art+'<div class="pfoot"><span class="pl">'+esc(c.label)+'</span></div></div>';
  }).join("");
  /* C1's stated rule: nothing picked means "Use this" is SECONDARY. A4 on the
     canvas contradicts it; the rule wins here and the divergence is flagged. */
  var useKind = P.mode==="picked" ? "pri" : "sec";
  var acts = P.buttons ? '<div class="pickacts">'+
    '<button class="btn sec" data-live="Regenerate all" data-act="regenAll">Regenerate all</button>'+
    '<button class="btn '+useKind+'" '+(P.mode==="picked"?'data-live="Use this" data-act="useThis"':'')+'>Use this</button>'+
    '</div>' : "";
  /* Two or three concepts read best as one horizontal row — the comparison is
     left-to-right and a wrapped row would break it. Four or more go to a square
     grid instead, because a single row of four or five shrinks every card until
     none of them can be judged. */
  var n = P.cards.length;
  var cols = n<=3 ? n : Math.ceil(Math.sqrt(n));
  return '<div class="pickwrap"><div class="pickh"><h2>'+esc(head.h)+'</h2>'+
    (head.s ? '<p>'+esc(head.s)+'</p>' : '')+'</div>'+
    '<div class="pickgrid" style="grid-template-columns:repeat('+cols+','+P.cardW+'px)">'+cards+'</div>'+acts+'</div>';
}

/* The prompt is DERIVED from the turn that produced the image, so a card can
   never describe itself with copy that has drifted from the thread. */
function promptForTurn(turn){
  if(!turn) return "";
  var m = S.chat.messages.filter(function(x){ return x.kind==="user" && x.turn===turn; })[0];
  return m ? m.text : "";
}
function gallery(){
  if(!S.gallery.open) return "";
  var cards = S.strip.items.map(function(it,i){
    var n = it.native || {w:S.canvas.nativeW, h:S.canvas.nativeH};
    var pr = it.prompt || promptForTurn(it.turn) || "No prompt recorded for this image";
    /* fit the real shape into the well: contain, never cover, never stretch */
    var BOXW = 186, BOXH = 134;
    var k = Math.min(BOXW/n.w, BOXH/n.h);
    var aw = Math.max(24, Math.round(n.w*k)), ah = Math.max(24, Math.round(n.h*k));
    return '<div class="galcard'+(i===S.strip.activeIndex?" on":"")+'" data-live="'+esc(it.label||("Image "+(i+1)))+'" data-act="galPick" data-i="'+i+'">'+
      '<div class="art"><div style="width:'+aw+'px;height:'+ah+'px">'+creative(aw,ah,it.variant,false)+'</div></div>'+
      '<div class="meta"><div class="gname">'+esc(ARTIFACT_NAMES[it.variant])+'</div>'+
      '<div class="gsize">'+n.w+' × '+n.h+' px</div>'+
      '<div class="gprompt">'+esc(pr)+'</div></div></div>';
  }).join("");
  return '<div class="gal">'+
    '<div class="galhead"><div><h2>All images</h2>'+
      '<div class="sub">'+S.strip.items.length+' images in this session</div></div>'+
      '<div class="hicon" data-live="Close gallery" data-act="closeGallery" style="cursor:pointer">'+
        ic("x",20,"var(--aira-slate-700)")+'</div></div>'+
    '<div class="galbody"><div class="galgrid">'+cards+'</div></div></div>';
}
function fullscreenOverlay(){
  if(!S.fullscreen.open) return "";
  var f=fit(), big=660;
  return '<div class="fs">'+
    '<div class="scrim"></div>'+
    '<div class="fsimg"><div style="width:'+big+'px;height:'+big+'px">'+creative(big,big,S.canvas.variant,true)+'</div></div>'+
    '<div class="fn2">'+esc(filename())+'</div>'+
    '<div class="dim2">'+S.canvas.nativeW+' × '+S.canvas.nativeH+'</div>'+
    '<div class="close2" data-live="Close full screen" data-act="exitFullscreen">'+ic("x",18,"var(--aira-slate-700)")+'</div>'+
    '<div class="esc">Press Esc to exit full screen</div></div>';
}

function exportDropdown(){
  if(!S.dropdown.open) return "";
  var fmts=["PNG","JPG","PDF"];
  return '<div class="expdd"><div class="caret2"></div><div class="body"><div style="padding:8px">'+
    fmts.map(function(f,i){
      var on = i===S.dropdown.selected;
      return '<div class="fmtrow'+(on?" on":"")+'" data-live="'+f+'" data-act="pickFormat" data-i="'+i+'">'+
        '<span>'+f+'</span>'+(on?ic("check",15,"var(--aira-indigo-600)"):'')+'</div>';
    }).join("")+'</div><div style="padding:8px;border-top:1px solid var(--aira-border-subtle)">'+
    '<button class="btn pri" data-live="Download" data-act="doDownload">Download</button></div></div></div>';
}

function homeScreen(){
  return '<div class="home"><div><h1>Welcome back, Ann</h1>'+
    '<p class="sub">Ask, build, test, and learn about your customers — all in one place.</p></div>'+
    '<div style="width:640px">'+composer()+'</div>'+
    '<div class="chiprow">'+
      '<div class="startchip" data-live="Pick a starting point" data-act="startImage">Pick a starting point</div>'+
      '<div class="startchip">Program health</div>'+
      '<div class="startchip">Trend analysis</div>'+
    '</div></div>';
}

/* ---- top-level render --------------------------------------------------- */
var app = document.getElementById("app"), frameEl = document.getElementById("frame"),
    holder = document.getElementById("holder"), stageEl = document.getElementById("stage");

function render(){
  frameEl.style.width  = S.stage.w+"px";
  frameEl.style.height = S.stage.h+"px";
  var html;
  if(S.stage.kind==="plate"){
    html = '<div class="plate" style="width:'+S.stage.w+'px;height:'+S.stage.h+'px;background:'+S.stage.bg+'">'
         + platePayload() + '</div>';
  } else {
    var centre;
    if(S.home) centre = homeScreen();
    else if(S.picker.visible) centre = pickerArea();
    else centre = '<div class="canvascol">'+canvasArea()+'</div>';
    html = '<div class="app">'+ (S.chrome.nav?capNav():"") +
      '<div class="uicol">'+ (S.chrome.topbar?topbar():"") +
      '<div class="mainrow">'+ chatPanel() +
        '<div style="flex:1;min-width:0;display:flex;flex-direction:column;position:relative">'+
          thumbStrip() + artifactHeader() +
          '<div class="canvaswrap">'+centre+drawer()+'</div>'+
          exportDropdown() +
        '</div>'+
      '</div></div>'+ sidecar() + gallery() + fullscreenOverlay() + '</div>';
  }
  app.innerHTML = html;
  /* A long thread must land on the turn being pointed at, not the bottom.
     Scroll is restored BEFORE anything else touches layout, and clamped, so
     the thread never parks in blank space past the end. */
  /* Typing re-renders, and a re-render destroys focus and the caret. Put both
     back deliberately — restore scroll FIRST, because focusing can scroll an
     element into view and undo it. */
  var th = document.getElementById("thumbs");
  if(th){
    th.scrollLeft = Math.max(0, Math.min(S.strip.scrollLeft, th.scrollWidth - th.clientWidth));
    th.addEventListener("scroll", function(){ S.strip.scrollLeft = th.scrollLeft; });
    /* keep the selected thumbnail visible — selecting one off-screen and not
       being shown it is the same bug as a focused element scrolled out of view */
    /* Measured with getBoundingClientRect, NOT offsetLeft. The stage is
       transform:scale'd, which leaves offsetParent null on these nodes, so
       offsetLeft returns a number that means nothing here. Rect deltas are
       divided by the stage scale to get back to the scroller's own units. */
    var sel = th.querySelector(".thumb52.on");
    if(sel){
      var k2 = frameEl.getBoundingClientRect().width / S.stage.w || 1;
      var tr = th.getBoundingClientRect(), sr = sel.getBoundingClientRect();
      if(sr.left < tr.left) th.scrollLeft -= (tr.left - sr.left)/k2 + 6;
      else if(sr.right > tr.right) th.scrollLeft += (sr.right - tr.right)/k2 + 6;
      th.scrollLeft = Math.max(0, Math.min(th.scrollLeft, th.scrollWidth - th.clientWidth));
      S.strip.scrollLeft = th.scrollLeft;
    }
  }
  var db = document.querySelector(".dbody");
  if(db && !S.resize.autoHeight){
    db.scrollTop = Math.max(0, Math.min(S.resize.scrollTop, db.scrollHeight - db.clientHeight));
    db.addEventListener("scroll", function(){ S.resize.scrollTop = db.scrollTop; });
    /* Same rule as the thumbnail strip: a selection you cannot see is not a
       selection. Picking a row inside a collapsed group opens that group, and
       the row it opened could easily land below the fold — so if the selected
       row is out of view after a render, bring it in. A no-op in the ordinary
       case where you clicked something already on screen. */
    var srow = db.querySelector(".trow2.on");
    if(srow){
      var k3 = frameEl.getBoundingClientRect().width / S.stage.w || 1;
      var dbr = db.getBoundingClientRect(), rr = srow.getBoundingClientRect();
      if(rr.top < dbr.top) db.scrollTop -= (dbr.top - rr.top)/k3 + 8;
      else if(rr.bottom > dbr.bottom) db.scrollTop += (rr.bottom - dbr.bottom)/k3 + 8;
      db.scrollTop = Math.max(0, Math.min(db.scrollTop, db.scrollHeight - db.clientHeight));
      S.resize.scrollTop = db.scrollTop;
    }
  }
  if(S.resize.focusField){
    var fsel = S.resize.focusField==="search" ? '[data-field="search"]'
             : S.resize.focusField==="w" ? '#dw' : '#dh';
    var fel = document.querySelector(fsel);
    if(fel){
      fel.focus();
      var c = S.resize.caret==null ? fel.value.length : Math.min(S.resize.caret, fel.value.length);
      try{ fel.setSelectionRange(c,c); }catch(e){}
    } else S.resize.focusField=null;
  }
  var m = document.getElementById("msgs");
  if(m){
    if(S.chat.scrollTo){
      var el = m.querySelector('[data-turn="'+S.chat.scrollTo+'"]');
      if(el){
        var top = el.offsetTop - m.offsetTop - 12;
        m.scrollTop = Math.max(0, Math.min(top, m.scrollHeight - m.clientHeight));
      } else m.scrollTop = m.scrollHeight;
    } else m.scrollTop = m.scrollHeight;
  }
  fitStage();
  placeDock();
}
var PLATE = null;
function platePayload(){ return PLATE ? PLATE() : ""; }

/* The toolbar hugs the image — 20px under it — rather than sitting at a fixed
   distance from the canvas floor, which left a large gap under a small image.
   It is CLAMPED so it can never leave the canvas: once the image is big enough
   that hugging it would push the toolbar off the bottom, it pins instead. That
   is the earlier requirement (never scroll away with the zoom) and this one
   (stay close to the image) satisfied together rather than one at a time. */
var DOCK_GAP = 20, DOCK_EDGE = 20;
function placeDock(){
  var dock = document.querySelector(".tbardock");
  var wrap = document.querySelector(".framewrap");
  if(!dock || !wrap) return;
  var art = document.getElementById("imgbox") || wrap.querySelector(".imgbox, .emptybox");
  /* getBoundingClientRect returns SCALED pixels (the stage is transform:scale'd)
     but style.top is applied in the frame's own unscaled space — so every
     measurement has to be divided back out or the toolbar lands nowhere near
     the image. */
  var k = frameEl.getBoundingClientRect().width / S.stage.w || 1;
  var wr = wrap.getBoundingClientRect();
  var dh = dock.getBoundingClientRect().height / k;
  var wh = wr.height / k;
  var maxTop = wh - dh - DOCK_EDGE;
  var top = maxTop;
  if(art){
    var ar = art.getBoundingClientRect();
    top = ((ar.bottom - wr.top) / k) + DOCK_GAP;
  }
  dock.style.bottom = "auto";
  dock.style.top = Math.max(DOCK_EDGE, Math.min(top, maxTop)) + "px";
}
function fitStage(){
  var pad = 48;
  /* Clamp the floor. On a short window (or a collapsed pane) this computed
     zero or a negative number and scale(0) collapsed the whole app to nothing
     — a blank stage that looks like a broken prototype rather than a small one.
     The shell scrolls horizontally, so a floor is safe. */
  var s = Math.min((stageEl.clientWidth-pad)/S.stage.w, (stageEl.clientHeight-pad)/S.stage.h, 1);
  if(!isFinite(s) || s < 0.2) s = 0.2;
  frameEl.style.transform = "scale("+s+")";
  holder.style.width  = (S.stage.w*s)+"px";
  holder.style.height = (S.stage.h*s)+"px";
}
window.addEventListener("resize", function(){ fitStage(); placeDock(); });
app.addEventListener("scroll", function(e){
  if(e.target && e.target.classList && e.target.classList.contains("fscroll")) placeDock();
}, true);
</script>

<script>
